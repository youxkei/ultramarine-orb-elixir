[workspace]
resolver = "2"
members = [
    "crates/launcher",
    "crates/orb",
    "crates/orb-api",
    "crates/orb-config",
    "crates/orb-core",
    "crates/orb-e2e",
    "crates/orb-sim",
    "crates/xtask",
]

[workspace.package]
# **`-dev` between releases, and a release is the one commit without it.** The version is in what
# ships and not only here — the DLL logs `orb <version>` the moment it attaches, and orb.log is what
# a report of a defect arrives as — so `orb 0.2.0` is an exe that was handed out and `orb 0.2.0-dev`
# is somebody's own build of a tree on the way to one. The suffix also names the release being worked
# towards, which is what makes it a decision taken here rather than at the moment of releasing.
#
# So a release is the commit that takes the suffix off, the `v`-tag on that commit, and the next
# `-dev` opened behind it. `.github/workflows/release.yaml` is what holds the tag and this line to the
# same number, and it refuses a `-dev` version outright — `v*` matches `v0.2.0-dev` as readily as
# `v0.2.0`, so a tag on any ordinary commit of main would otherwise be built and handed out.
version = "0.4.0-dev"
edition = "2024"
publish = false

[workspace.dependencies]
orb-api = { path = "crates/orb-api" }
orb-config = { path = "crates/orb-config" }
orb-core = { path = "crates/orb-core" }
orb-sim = { path = "crates/orb-sim" }
windows-sys = "0.59"

# Here rather than in each crate because cargo unions the features of both, so one of them
# asking for the defaults would put them in the other's build as well. No colour: what the
# launcher cannot read it prints to a terminal, and what the DLL cannot read goes into
# orb.log, where escape codes are noise. `wrap_help` because without it nothing is wrapped at
# all, and the options are described in paragraphs.
[workspace.dependencies.clap]
version = "4"
default-features = false
features = ["std", "derive", "help", "usage", "error-context", "suggestions", "wrap_help"]

[profile.release]
# Unwinding out of a hook would cross back into the game's frames, which the
# game's MSVC6 code cannot handle. Abort instead; the panic hook logs first.
panic = "abort"
lto = true
codegen-units = 1
