# Artifact dependencies, so the launcher can depend on `orb` as a cdylib and be handed the
# path of the built DLL to carry inside itself. Cargo then orders the two builds and
# rebuilds the launcher when the DLL changes, neither of which it will do for a sibling
# crate reached any other way.
[unstable]
bindeps = true

# Every command that has to name a target: `cargo xtask clippy`, `test`, `build` and `coverage`. No
# `--target` of its own, deliberately — it builds for the host on every host, which is what a task
# runner has to do to be able to spawn `cargo` at all. See `crates/xtask/src/main.rs`.
[alias]
xtask = "run --quiet --package xtask --"

# `crt-static` because without it `orb.exe` and the DLL it carries import `VCRUNTIME140.dll`, which
# nothing that runs a game of this age can be assumed to have installed. The one file that is handed
# out is then the whole of what runs.
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# The 64-bit build th06c and th06nc are injected with, for the same reason.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
