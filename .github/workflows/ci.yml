name: CI

# What the pre-commit hook runs, on a machine that is not the author's. The three
# commands and their order are `.husky/pre-commit`'s; a check that holds locally and
# not here is a check that was passing because of something untracked.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # husky-rs points git's core.hooksPath at .husky on the first build. There is no
  # commit to gate here, and a build that edits git's config is a build that has
  # touched something it was not asked to.
  NO_HUSKY_HOOKS: 1

# One job, on Windows. orb is a DLL injected into a Windows game and there is no host it will ever run
# on that is not Windows, so nothing here asks whether it builds for one — and it could not be asked
# of all of it anyway: `orb-core` calls the game's own functions by the conventions MSVC6 compiled
# them with, `thiscall` and `fastcall`, which exist on 32-bit x86 and nowhere else. A crate above the
# seam that names `windows-sys` is then a design boundary crossed rather than a build broken, and
# nothing here catches it. See *Put Windows behind a seam* in TODO.md.
jobs:
  test:
    # Windows rather than a cross-compile run under Wine. The tests are
    # i686-pc-windows-gnu binaries and some of them ask Windows about the process's
    # own pages — `mem::read_committed` reads back what VirtualQuery says about
    # alignment, commitment and PAGE_GUARD — so a Wine run would be establishing what
    # Wine does with those, which is not the thing being relied on.
    runs-on: windows-latest

    defaults:
      run:
        # The mingw32 shell, so the linker `.cargo/config.toml` names is on PATH.
        # Set for every `run` step rather than per step: the first one that got the
        # plain Windows shell would fail at link time and say only that cc was not
        # found.
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      # 32-bit mingw, which is not what the runner image's own MSYS2 installation
      # carries: the game is a 32-bit process, so both halves target i686 and the
      # linker has to be the i686 one.
      #
      # `path-type: inherit` keeps the Windows PATH inside this shell, which is where
      # rustup puts cargo — without it the toolchain installed below is not reachable
      # from the steps that use it.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          path-type: inherit
          install: mingw-w64-i686-gcc

      # The channel and the target are `rust-toolchain.toml`'s. Naming them again here
      # is what installs them before the first cargo call rather than during it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: i686-pc-windows-gnu
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # Every warning and every target, so the tests are covered too. Where a lint is
      # wrong about this code the answer in the tree is an allow with the reason beside
      # it, so zero warnings is a state this can be held to.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
