name: Release

# The exe the README tells whoever is going to play to download, built somewhere that is not the
# author's machine and attached to the release that link resolves to. A tag push is the whole of
# making a release: the release and the asset are created together here, so a release with no
# orb.exe on it never exists.
#
# Not `on: release`, with the release published by hand and this filling in the asset afterwards.
# What the README links to is the *latest* release, and between publishing and the upload finishing
# that link resolves to a release with nothing to download.

on:
  push:
    # A tag in any other shape pushes cleanly and fires nothing, which from the outside is
    # indistinguishable from a release still building.
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  # `gh release create`. A workflow's token is read-only by default.
  contents: write

jobs:
  release:
    # Windows, and not a cross build for the same reasons ci.yaml gives: the linker is the 32-bit
    # mingw one and `orb-core` calls the game's own methods by conventions that exist on 32-bit x86
    # and nowhere else.
    runs-on: windows-latest

    defaults:
      run:
        # The mingw32 shell, so the linker `.cargo/config.toml` names is on PATH — and so gh, which
        # the Windows PATH carries, is reachable from the step that attaches the exe.
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      # The three setup steps are ci.yaml's, and why each is shaped the way it is — MINGW32 rather
      # than the runner image's own MSYS2, `path-type: inherit` for the cargo rustup put on the
      # Windows PATH, the channel and the target named again so they install before the first cargo
      # call — is written there. One target rather than two: nothing here is checked for the host
      # with no Windows on it, so `rust-toolchain.toml`'s second one has nothing to do.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          path-type: inherit
          install: mingw-w64-i686-gcc

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: i686-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      # The tag and `[workspace.package] version` name the same release, and this is what holds them to
      # it. The version is in what ships rather than only in the repository: the DLL logs
      # `orb <CARGO_PKG_VERSION>` the moment it attaches, and orb.log is what a report of a defect
      # arrives as — so an exe whose log names a version other than the release it was downloaded from
      # cannot be placed at all.
      #
      # The `-dev` case is refused rather than compared. main carries `X.Y.Z-dev` between releases and
      # `tags: ["v*"]` matches `v0.2.0-dev` as readily as `v0.2.0`, so without this a tag on any ordinary
      # commit of main would build a release out of a tree whose version says it is on the way to one.
      #
      # In front of the build, so a tag that names the wrong version costs the setup steps rather than
      # the link. Behind them rather than up beside the checkout because it is itself a cargo call:
      # `rust-toolchain.toml` pins nightly and the first cargo call is what installs it, and
      # `Swatinem/rust-cache@v2` is what belongs in front of every cargo call in a job.
      #
      # Not the other direction, with the version written into Cargo.toml out of the tag here. Then
      # Cargo.toml no longer says which version the tree is, so every build that is not this workflow's
      # builds a version that does not exist, and the write puts the tree the release is built from out
      # of step with the commit the tag names.
      #
      # `cargo pkgid` rather than a grep over Cargo.toml, where `version` is not one line — clap's
      # dependency table carries one of its own below the workspace's. It names a package because a
      # workspace with no root package has no version to be asked for; every member inherits this one,
      # and `orb-launcher` is the package the exe is built from.
      #
      # A mismatch is caught with the tag already pushed, so the way out of it is deleting that tag and
      # pushing the right one. That is the cost of checking here, and it is paid on the releases that
      # would otherwise have gone out mislabelled.
      - name: Check the tag names the version in Cargo.toml
        run: |
          version=$(cargo pkgid -p orb-launcher | sed 's/.*[@#]//')
          case "$version" in
            *-dev)
              echo "tag $GITHUB_REF_NAME names a commit whose version is $version," >&2
              echo "which is a version on the way to a release rather than one" >&2
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not name Cargo.toml's version $version" >&2
            exit 1
          fi

      # No fmt, clippy, seam or suite in front of this. A tag names a commit that is already on main,
      # where ci.yaml ran all four against this same tree; running them again would only make the
      # release later.
      #
      # And no NO_HUSKY_HOOKS, which ci.yaml sets: husky-rs is a dev-dependency, and a `cargo build`
      # does not build those, so nothing here reaches the build script that points git at .husky.
      - name: Build
        run: cargo xtask build --release

      # The release and its one asset in a single call. One asset because orb.exe carries orb.dll
      # inside itself, so there is nothing else to hand out, and no orb.yaml is every default.
      #
      # `--title` and `--generate-notes` because gh given neither prompts for both, and fails
      # outright where there is no terminal to prompt at. The notes are the commits since the last
      # release, which is the log — a release carries nothing that is not in there.
      #
      # A tag that already has a release fails here rather than clobbering the exe on it: re-running
      # this over a release people have already downloaded from replaces the file under them.
      - name: Attach orb.exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          target/i686-pc-windows-gnu/release/orb.exe
