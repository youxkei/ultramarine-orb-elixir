name: CI

# What `cargo xtask check` runs, on a machine that is not the author's. The four commands
# and their order are that task's; a check that holds locally and not here is a check that
# was passing because of something untracked.
#
# A step apiece rather than the task itself, so that which of the four failed and what each
# cost are read off the run without opening its log. `--test-threads` is the one thing the
# two do differently: the task names four, and here the runner is the whole machine.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# One job, on Windows. orb is a DLL injected into a Windows game and there is no host it will ever
# run on that is not Windows, so nothing here builds the whole of it for another one — and nothing
# could: `orb-core` calls the game's own functions by the conventions MSVC6 compiled them with,
# `thiscall` and `fastcall`, which exist on 32-bit x86 and nowhere else.
#
# What *is* asked for another host is the boundary, which is what `cargo xtask seam` is: `orb-core`
# and `orb-sim` checked for a 32-bit Linux target, where the two ABIs still exist and Windows does
# not. A crate above the seam that reaches past it then fails to compile rather than being caught by
# hand.
jobs:
  test:
    # Windows rather than a cross-compile run under Wine. The tests are
    # i686-pc-windows-msvc binaries and some of them ask Windows about the process's
    # own pages — `mem::read_committed` reads back what VirtualQuery says about
    # alignment, commitment and PAGE_GUARD — so a Wine run would be establishing what
    # Wine does with those, which is not the thing being relied on.
    #
    # The linker is the Visual Studio one the runner image carries, which links for
    # i686 as it is.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The channel and the targets are `rust-toolchain.toml`'s. Naming them again here
      # is what installs them before the first cargo call rather than during it. The
      # second is what th06c's own e2e tests run for, that game being a 64-bit build, and
      # the third is the one `cargo xtask seam` checks the crates above the seam for — a
      # std component like any other, and which host it names is nothing to a
      # `cargo check`, since there is nothing to link and nothing to run.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: i686-pc-windows-msvc, x86_64-pc-windows-msvc, i686-unknown-linux-gnu
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # Every warning and every target, so the tests are covered too — and both of the
      # targets the suite is run for, the 64-bit half being a build like any other. Where
      # a lint is wrong about this code the answer in the tree is an allow with the reason
      # beside it, as narrow as the thing it is wrong about, so zero warnings is a state
      # this can be held to.
      #
      # Through `xtask` because the targets have to be named and there is no
      # `[build] target` naming them — see `.cargo/config.toml`. `cargo fmt --check` above
      # needs no target.
      - name: Clippy
        run: cargo xtask clippy

      # The boundary, asked for rather than remembered. It fails the day somebody writes a
      # `windows-sys` import into `orb-core` or `orb-sim`, or reaches a COM vtable that no
      # grep for that name would find.
      - name: Seam
        run: cargo xtask seam

      # Both halves of the suite: what ships, and th06c's own e2e tests, which are a
      # 64-bit build — see `ALSO` in `crates/xtask/src/main.rs`.
      - name: Test
        run: cargo xtask test
