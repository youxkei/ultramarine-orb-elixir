[package]
name = "orb-config"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The file seam. `orb.yaml` goes through it for the same reason the run left unfinished does: a test that
# read and wrote a real one would be a test with a temporary directory to empty and no way to ask what a
# write that failed does. See
# [docs/adr/0012](../../docs/adr/0012-orb-reads-and-writes-its-own-files-through-the-seam.md).
[features]
sim = ["orb-api/sim"]

[dependencies]
orb-api = { workspace = true }
clap.workspace = true
serde = { version = "1", features = ["derive"] }

# serde_yaml itself is archived; this is the fork that carried it on, with the same API.
serde_yaml_ng = "0.10"
