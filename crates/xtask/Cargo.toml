[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The tasks that have to name a target. Written in Rust and run through the `xtask` alias in
# `.cargo/config.toml` so that there is nothing to install and the recipe is checked by the same compiler as
# everything else.
#
# **No library dependencies.** What it does is set environment variables and spawn programs, which is `std`,
# and a task runner that linked a crate in would be a build to keep working for the sake of one binary nobody
# ships.
[dependencies]
# **`cargo llvm-cov` built as an artifact rather than installed**, so that `cargo xtask coverage` needs
# nothing on the machine but the toolchain: the version is `Cargo.lock`'s, and the binary lands in `target/`.
# Not `cargo install` or `cargo binstall` beside a README line — that is a second thing for every checkout to
# get right and keep at the version this tree was measured with. What it costs is its build, once, the first
# time `xtask` is built.
cargo-llvm-cov = { version = "0.9.1", artifact = "bin" }
