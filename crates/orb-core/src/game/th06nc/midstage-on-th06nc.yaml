# **The half on th06nc of holding `chapters.rs` against th06c** — `../th06c/midstage-on-th06c.yaml` is the
# other half, the Extra's row `extra-on-th06nc.yaml`. A run of Normal in the rewindable mode, paused on each
# chapter a row begins and let go again with the pause menu's first item, so that a picture of the window
# can be taken from outside and held against th06c's of the same chapter.
#
# The chapter numbers are th06c's for the same boundaries: this game's midbosses are chaptered as th06c's
# are, one chapter a stage 2 midboss, two a stage 4 one and three a stage 3, 5 or 6 one, so a row carried
# across begins the chapter it begins there. The pass holds only if this game's lines say those numbers
# over this table's `tl`s. The walk is a_run_played_to_its_clear's.
#
# **Driven as** `drive-a-run.sh <copy> th06nc.exe midstage-on-th06nc.yaml --log=normal --pace=8 --speed=1
# --no-resume` with `shoot-the-pauses.sh <copy> th06nc.exe 32 4 s1-tl4346 s2-tl790 s2-tl4507 s3-tl809
# s3-tl2453 s4-tl2257 s4-tl3321 s4-tl7353 s4-tl8214 s4-tl9625 s5-tl2263 s5-tl6727 s6-tl1450` beside it —
# the first pause being step 32 and each after it four on.
