# **The Extra's row of `chapters.rs` held against th06c, the half on th06nc** — `../th06c/extra-on-th06c.yaml`
# is the other, and `midstage-on-th06nc.yaml` says what the pauses are for. Chapters 2, 3, 8 and 9, which is
