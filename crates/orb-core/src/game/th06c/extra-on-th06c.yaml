# **The Extra's row of `chapters.rs` held against th06 1.02h, the half on th06c** — `extra-on-th06.yaml` is the
# other, and `midstage-on-th06c.yaml` says what the pauses are for. Chapters 2, 3, 8 and 9, which is what th06
# numbers the row's four as (`stage 7 chapter 8 at frame 9121 (script 5448): tl 5448`), the midboss's four
# between them. The walk is the_extra_a_cleared_run_unlocked's, so the copy's records have to hold the Extra
# unlocked — a_normal_mode_run_played_to_its_clear is what gets them there.
