# **The half on th06c of holding `chapters.rs` against th06 1.02h** — `midstage-on-th06.yaml` is the other
# half, the Extra's row `extra-on-th06c.yaml`. A run of Normal in the rewindable mode, paused on each chapter
# a row begins and let go again with the pause menu's first item, so that a picture of the window can be
# taken from outside: this game draws through a swapchain orb's own `screenshot` step does not reach.
#
# The chapter numbers are th06's own for the same boundaries, read off a launch of it —
# `stage 2 chapter 5 at frame 4597 (script 4597): tl 4597` — and the pass holds only if this game's lines say
# the same number over the same `tl`. The walk is a_run_played_to_its_clear's, aimed at Normal.
#
# **Driven as** `drive-a-run.sh <copy> th06c.exe midstage-on-th06c.yaml --log=normal --pace=8 --no-resume`
# with `shoot-the-pauses.sh <copy> th06c.exe 20 4 s1-tl4472 s2-tl880 s2-tl4597 s3-tl1009 s3-tl2653 s4-tl2341
# s4-tl3395 s4-tl7467 s4-tl8328 s4-tl9739 s5-tl2363 s5-tl6827 s6-tl1535` beside it — the first pause being
# step 20 and each after it four on. A launch of it took eleven minutes.
