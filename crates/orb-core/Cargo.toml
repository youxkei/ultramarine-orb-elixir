[package]
name = "orb-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Everything that decides what happens to a run, with no `windows-sys` in it. Everything it asks of the
# host goes through `orb-api`, and `cargo xtask seam` holds it to that by checking it for a host with no
# Windows — 32-bit, because the game's own methods are called by the conventions MSVC6 compiled them with
# and `extern "thiscall"` exists on x86 and nowhere else. So the tripwire is armed rather than described,
# which is what the earlier version of this comment claimed and nothing checked. See
# [docs/adr/0009](../../docs/adr/0009-orb-injects-and-nothing-else-and-every-com-object-is-behind-the-seam.md).
[features]
# The test support other crates' tests reach for — `game::th06::image`, the game laid out by hand.
# A feature as well as `cfg(test)` because `cfg(test)` is false in a crate compiled as a
# *dependency* of a test binary, which is what this crate is when `orb`'s tests or `orb-sim`'s
# e2e tests drive it. Same reason as `orb-api`'s feature of the same name, and it turns that one on.
#
# `orb-config/sim` goes with it because that crate reads and writes `orb.yaml` through the file seam:
# cargo would union `orb-api/sim` in anyway, and naming it here is what says the chain was meant.
sim = ["orb-api/sim", "orb-config/sim", "dep:orb-sim"]

[dependencies]
orb-api = { workspace = true }
orb-config = { workspace = true }
serde = { version = "1", features = ["derive"] }

# MessagePack through serde: the file a run is left in is the same derived structs as everything
# else, written with the field names in them so that any converter can print one back without being
# told the format. See `resume::EXTENSION`.
rmp-serde = "1.3"

# Only under `sim`, and only for `game::th06::image` — th06's own addresses laid out in a simulated
# Windows, which is kept beside the offsets it is written from rather than in the simulator, where it
# would be the one piece of game knowledge in a crate that knows nothing else about the game.
#
# `orb-sim`'s own `tests/` depend back on this crate, which cargo allows: that direction is a
# dev-dependency, so it is outside the normal build graph and the two do not form a cycle in it.
orb-sim = { workspace = true, optional = true }

# For `build.rs`, which bakes `brush.png` down to the coverage the mark over the lives is drawn
# from. Only the inflate is taken from a crate: walking a PNG's chunks and undoing its row filters
# is sixty lines that say what the picture is, where a decoder would be eight crates saying it for
# every picture there has ever been.
[build-dependencies]
miniz_oxide = "0.8"

# And again here, unconditionally, so that this crate's *own* tests reach the simulator without
# anyone having to remember `--features sim`: `cargo test -p orb-core` is then enough. The optional
# dependency above is for when another crate's tests drive this one, where `cfg(test)` is false and
# the feature is what carries `image` in.
[dev-dependencies]
orb-sim = { workspace = true }

# For the tests over the file a run is left in, which build a MessagePack map by hand: what has to be
# refused is a *file* of the wrong shape, however it came to be one, and that is not something the
# derived writer can be asked to produce.
rmpv = "1.3"
