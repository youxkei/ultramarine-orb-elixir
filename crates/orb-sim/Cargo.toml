[package]
name = "orb-sim"
version.workspace = true
edition.workspace = true
publish.workspace = true

# A simulated Windows: implements `orb_api::Win` over state laid out by hand, with no
# `windows-sys` anywhere in it. The `sim` feature is on here rather than left to whoever depends
# on this crate, because a simulated Windows that cannot be installed is one nothing can reach.
[dependencies]
orb-api = { workspace = true, features = ["sim"] }

# What is left in `tests/` is the four no game drives — `orb_core::log` and `frame::Pacing`, driven with
# a `Sim` installed and nothing of a game anywhere in them. Every launch went to `orb-e2e`, which is
# also where `orb` stopped being named from here: `orb-sim` → `orb` → `orb-core` → `orb-sim` closed as a
# cycle cargo took only because a dev-dependency edge is outside the normal build graph, and it is gone.
# See
# [docs/adr/0009](../../docs/adr/0009-orb-injects-and-nothing-else-and-every-com-object-is-behind-the-seam.md).
#
# Dev-dependencies rather than dependencies because nothing in the simulator itself knows about orb's
# logic. `orb-core`'s own `sim` feature depends back on this crate, and `crates/orb-core/Cargo.toml`
# says why.
[dev-dependencies]
orb-config = { workspace = true }
orb-core = { workspace = true, features = ["sim"] }
