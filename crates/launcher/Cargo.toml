[package]
name = "orb-launcher"
version.workspace = true
edition.workspace = true
publish.workspace = true

# `orb.exe`, since it is the whole of what gets installed and orb is what that is called. The
# package keeps a name of its own because the crate named `orb` is the DLL this one carries.
[[bin]]
name = "orb"
path = "src/main.rs"

[dependencies]
orb-config.workspace = true
clap.workspace = true
md-5 = "0.10"

# For one item of it: `game::KNOWN`, the table of games orb knows. Read here as well as in the DLL so
# that the two cannot disagree about which games exist — a launcher with an exe name of its own would
# be a second list to keep in step. Nothing else of this crate is reached; the `&'static dyn Game` in
# each entry is the DLL's to use.
orb-core.workspace = true

# Not linked against: depended on for its built cdylib, whose path arrives as
# `CARGO_CDYLIB_FILE_ORB` so the launcher can carry the DLL inside itself.
#
# **The launcher's own target and not a named one**, which is what `"target"` means to cargo: a 32-bit
# process cannot load a 64-bit DLL and a 64-bit one cannot load a 32-bit DLL, so the DLL this exe carries
# has to be the architecture the exe is — th06 and th07 are 32-bit games and th06c is a 64-bit one, and
# each is reached by the build of orb that matches. Pinned to `i686-pc-windows-gnu` instead, a 64-bit
# launcher carried the 32-bit DLL and the injection ended at `LoadLibraryW returned NULL`.
# One per architecture rather than `target = "target"`, which cargo takes in build-dependencies and
# refuses here: only the table whose `cfg` matches the launcher's own target is read, so the exe is handed
# the DLL of its own architecture either way.
[target.'cfg(target_arch = "x86")'.dependencies.orb]
path = "../orb"
artifact = "cdylib"
target = "i686-pc-windows-gnu"

[target.'cfg(target_arch = "x86_64")'.dependencies.orb]
path = "../orb"
artifact = "cdylib"
target = "x86_64-pc-windows-gnu"

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
