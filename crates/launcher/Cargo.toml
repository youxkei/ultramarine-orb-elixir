[package]
name = "orb-launcher"
version.workspace = true
edition.workspace = true
publish.workspace = true

# `orb.exe`, since it is the whole of what gets installed and orb is what that is called. The
# package keeps a name of its own because the crate named `orb` is the DLL this one carries.
[[bin]]
name = "orb"
path = "src/main.rs"

[dependencies]
orb-config.workspace = true
clap.workspace = true
md-5 = "0.10"

# For one item of it: `game::KNOWN`, the table of games orb knows. Read here as well as in the DLL so
# that the two cannot disagree about which games exist — a launcher with an exe name of its own would
# be a second list to keep in step. Nothing else of this crate is reached; the `&'static dyn Game` in
# each entry is the DLL's to use.
orb-core.workspace = true

# Nothing here calls it. Its build script is what points git at `.husky` for this repository's
# hooks, and a workspace with no root package has to hang that off one of its members.
[dev-dependencies]
husky-rs = "0.4"

# Not linked against: depended on for its built cdylib, whose path arrives as
# `CARGO_CDYLIB_FILE_ORB` so the launcher can carry the DLL inside itself.
[dependencies.orb]
path = "../orb"
artifact = "cdylib"
target = "i686-pc-windows-gnu"

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
