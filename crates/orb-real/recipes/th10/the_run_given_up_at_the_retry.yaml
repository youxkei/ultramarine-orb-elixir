# **th10's run given up at orb's own question of where to start again**, which is the last of the ways it
# offers: the run is over, the game carries on into its own front end, and the chapters it had are gone.
#
# **Asked in the stage's first chapter, where nothing is behind it.** `RetryMenu::new` leaves
# 更に前からやり直す out of the ways where the chapters behind the lost one are none, so the items here are the
# chapter, the stage and the run given up — and giving the run up is **item 2**. A recipe that asked deeper
# would have four items and it would be 3.
#
# **The front end is walked by this game's own screen numbers** — see `a_run_started_and_given_up.yaml`,
# which walks the same four — with orb's own mode question over the main menu's first item, answered with the
# pointdevice mode: the question this case is about is the mode's own.
- press: [decide]
  frames: 10
  until: { screen: 2 }
  give_up_after: 3600
- press: [up]
  frames: 10
  until: { screen: 2, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { question: mode }
  give_up_after: 900
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 6 }
  give_up_after: 1800
- press: [up]
  frames: 10
  until: { screen: 6, cursor: 0 }
  give_up_after: 900
- press: [down]
  frames: 10
  until: { screen: 6, cursor: 1 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 7 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 8 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 8, cursor: 0 }
  give_up_after: 900
- bombs: false
- press: [decide]
  frames: 10
  until: { stage: 1, chapter: 0 }
  give_up_after: 900
# A second of the stage, so that the run is in its first chapter and no further.
- play_until: { frames: 60 }
  give_up_after: 7200
# **The ask, the run given up, and the screen that naming raises answered with yes.**
- start_over: true
- answer: { question: retry, item: 2 }
  give_up_after: 600
- answer: { question: retry, item: 0 }
  give_up_after: 600
# **And nothing after it but the game closed**, the run being over: a `leave` would have nothing to give up,
# and the front end is where the game takes itself.
- wait_until: { frames: 300 }
- quit: true
