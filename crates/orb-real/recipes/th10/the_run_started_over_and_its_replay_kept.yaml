# **The run the case before left, started over from the beginning with its replay kept** — which is the
# other half of what orb's own question offers: `つづきから` picks the chapter up and `はじめから` throws it
# away, and a fresh run would write over the replay the run before it was writing, so orb keeps that one first.
#
# **This case plays `a_death_answered_by_the_chapter_again.yaml` first**, so the chapter and the replay it
# answers about are that run's — see `Case::before`.
#
# **The front end is walked by this game's own screen numbers** — see `a_run_started_and_given_up.yaml`,
# which walks the same four.
- press: [decide]
  frames: 10
  until: { screen: 2 }
  give_up_after: 3600
- press: [up]
  frames: 10
  until: { screen: 2, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { question: mode }
  give_up_after: 900
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 6 }
  give_up_after: 1800
- press: [up]
  frames: 10
  until: { screen: 6, cursor: 0 }
  give_up_after: 900
- press: [down]
  frames: 10
  until: { screen: 6, cursor: 1 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 7 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 8 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 8, cursor: 0 }
  give_up_after: 900
- bombs: false
# **はじめから**, which is what this case is about: the chapter the run before left is thrown away and the run
# starts at its own beginning. **Asked on the frame the shot select asks for the run**, which is where this
# game's question goes up — see `the_run_of_th10_left_behind.rs`.
- press: [decide]
  frames: 10
  until: { question: resume }
  give_up_after: 900
- answer: { question: resume, item: 1 }
  give_up_after: 600
# **And no question about the replay**, which the fresh run would otherwise write over: asked as the run is
# chosen, orb keeps it without asking.
- wait_until: { frames: 300 }
# **And the fresh run played into its second chapter**, which is what says it is a run and not a playback:
# the midboss's first attack, which launches of the real game read at frame 2521 of stage 1.
- play_until: { stage: 1, chapter: 2 }
  give_up_after: 6000
- leave: true
- wait_until: { frames: 300 }
- quit: true
