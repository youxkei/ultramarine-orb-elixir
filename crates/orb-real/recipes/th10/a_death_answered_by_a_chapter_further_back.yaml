# 更に前からやり直す over a death: a run of th10 played clean into the third chapter of its first stage — the
# midboss's second attack, at frame 3247 of the stage — hit on purpose there, and the retry question the
# death raised answered with the chapters behind the one it died in: the nearest of them chosen and
# confirmed, so the run comes back in a chapter it had already played through, on the frame that chapter
# began on, and plays it again up to the one it died in.
#
# **The recipe answers the question and not the rules**: the rules take orb's offer to retry the frame it
# comes up, with the chapter again, everywhere but under a step that answers it itself — see
# `orb_bot::a_step_answers_the_retry` — so the hits are turned on and the next step is that answer, which is
# the step the death lands under.
#
# **The third chapter and not the second**, the list's nearest being then a chapter and not the stage: th08's
# case of this name, hit in its second, found the list holding only the stage's own start.
#
# The walk to the run and the three answers are a_chapter_further_back_taken_again.yaml's.
- press: [decide]
  frames: 10
  until: { screen: 2 }
  give_up_after: 3600
- press: [up]
  frames: 10
  until: { screen: 2, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { question: mode }
  give_up_after: 900
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 6 }
  give_up_after: 1800
- press: [up]
  frames: 10
  until: { screen: 6, cursor: 0 }
  give_up_after: 900
- press: [down]
  frames: 10
  until: { screen: 6, cursor: 1 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 7 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 8 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 8, cursor: 0 }
  give_up_after: 900
- bombs: false
- press: [decide]
  frames: 10
  until: { stage: 1, chapter: 0 }
  give_up_after: 900
- play_until: { stage: 1, chapter: 3 }
  give_up_after: 18000
- take_hits: { chance: 1.0, times_each_retry: 0.0, gives_up: 0.0 }
- answer: { question: retry, item: 1 }
  give_up_after: 18000
- answer: { question: retry, item: 0 }
  give_up_after: 600
- answer: { question: retry, item: 0 }
  give_up_after: 600
# And no chance of a hit on the way back up, so that the chapter died in is reached again.
- take_hits: { chance: 0.0, times_each_retry: 0.0, gives_up: 0.0 }
- play_until: { stage: 1, chapter: 3 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
