# **A chapter of th10's second stage taken again and played past**, which is what says the mode's chapters
# are the stage's own and not the run's: a snapshot taken in stage 2 puts the run back into stage 2, with
# the stage's own clock and its generator where that chapter began.
#
# **The front end is walked by this game's own screen numbers** — see `a_run_started_and_given_up.yaml`,
# which walks the same four — with orb's own mode question over the main menu's first item answered with the
# pointdevice mode: the chapters are the mode's.
- press: [decide]
  frames: 10
  until: { screen: 2 }
  give_up_after: 3600
- press: [up]
  frames: 10
  until: { screen: 2, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { question: mode }
  give_up_after: 900
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 6 }
  give_up_after: 1800
- press: [up]
  frames: 10
  until: { screen: 6, cursor: 0 }
  give_up_after: 900
- press: [down]
  frames: 10
  until: { screen: 6, cursor: 1 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 7 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 8 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 8, cursor: 0 }
  give_up_after: 900
- bombs: false
- press: [decide]
  frames: 10
  until: { stage: 1, chapter: 0 }
  give_up_after: 900
# **The run played into the second stage**: stage 1 of a run by the rules took 8,367 frames on its own
# (a practice of it, 2026-10-01), and a death in it costs the chapter again.
- play_until: { stage: 2, chapter: 1 }
  give_up_after: 30000
# **And that chapter asked for again through the game's own pause menu item**, which costs no death: orb
# takes the item off and answers with its own question, whose first item is the chapter the run is in.
- start_over: true
- answer: { question: retry, item: 0 }
  give_up_after: 600
# **And played past it, which a fight's first attack is**: a chapter is cut where the stage's midboss
# attacks, so a run that reaches her from the chapter it was put back into has crossed the boundary the
# check looks for.
- play_until: { boss: true }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
