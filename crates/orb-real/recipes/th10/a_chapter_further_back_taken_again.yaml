# **A chapter of th10 further back than the one the run is in, taken again** — which is the second of the
# ways orb's own question of where to start again offers, and the one with a screen of its own behind it: the
# chapters the stage has behind the chapter that was lost, each listed by where it is.
#
# **Asked in the stage's third chapter, so that two are behind it.** `RetryMenu::new` leaves
# 更に前からやり直す out of the ways where those are none, so this recipe plays into stage 1's third chapter —
# the midboss's second attack, at frame 3247 of the stage, the first being chapter 2 at 2521 — and the ways are
# then the chapter, a chapter further back, the stage and the run given up, with the second of them **item 1**.
#
# **Three answers and not two**: the item names the screen, the screen names the chapter, and the naming
# raises the same yes as every other way.
#
# **The front end is walked by this game's own screen numbers** — see `a_run_started_and_given_up.yaml`,
# which walks the same four — with orb's own mode question over the main menu's first item, answered with the
# pointdevice mode.
- press: [decide]
  frames: 10
  until: { screen: 2 }
  give_up_after: 3600
- press: [up]
  frames: 10
  until: { screen: 2, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { question: mode }
  give_up_after: 900
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 6 }
  give_up_after: 1800
- press: [up]
  frames: 10
  until: { screen: 6, cursor: 0 }
  give_up_after: 900
- press: [down]
  frames: 10
  until: { screen: 6, cursor: 1 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 7 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 8 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 8, cursor: 0 }
  give_up_after: 900
- bombs: false
- press: [decide]
  frames: 10
  until: { stage: 1, chapter: 0 }
  give_up_after: 900
- play_until: { stage: 1, chapter: 3 }
  give_up_after: 18000
# **The ask, the screen of chapters named, the first of them taken, and the yes behind it.**
- start_over: true
- answer: { question: retry, item: 1 }
  give_up_after: 600
- answer: { question: retry, item: 0 }
  give_up_after: 600
- answer: { question: retry, item: 0 }
  give_up_after: 600
# **And the run playing on from there back up to the chapter it was asked in**, which is what says the
# snapshot that chapter is landed — and what the check holds it to.
- play_until: { stage: 1, chapter: 3 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
