# **One stage of th11 practised on its own, rewound like any other run and written down for like none** — the
# main menu's item 2, which sets the run's flag `0x10` (0x43a57e, `State::practice`).
#
# **Its walk is the run's with one screen more**: 5 the difficulty, put at the one the title keeps (1 where that is
# the Extra's, 0x43a5b2), 6 the character and 7 the partner, whose `decide` puts up 8, the practice's stage, its
# cursor the stage counted from nought, and whose own `decide` asks for the run (0x43da11 through 0x43da3a). That
# `decide` counts only for a stage the shot type's record marks offered (0x43d80a), and a stage is marked where a run
# not replayed wins it (0x41eb61, 0x41eb92) — so this case starts from records of a Normal clear of Reimu and
# Yukari (`orb_real::Start::ANormalClear`), every stage of which is marked, and the mode's question reads the marks
# out of the game's own file (`Th11::read_what_the_modes_file_records`).
#
# **The main menu's cursor lands on the Extra on the way**, which those records light (0x439350 at 0x43a0c3), so the
# `down` taps on till the cursor is on item 2.
#
# **With orb's own mode question over the item, answered with the pointdevice mode**, which is what makes the
# chapter taken again below a chapter orb put back.
- wait_until: { screen: 1 }
  give_up_after: 3600
- press: [down]
  frames: 10
  until: { screen: 1, cursor: 2 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { question: mode }
  give_up_after: 900
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 5 }
  give_up_after: 1800
- press: [up]
  frames: 10
  until: { screen: 5, cursor: 0 }
  give_up_after: 900
- press: [down]
  frames: 10
  until: { screen: 5, cursor: 1 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 6 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 6, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 7 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 8 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 8, cursor: 0 }
  give_up_after: 900
- bombs: false
- press: [decide]
  frames: 10
  until: { stage: 1, chapter: 0 }
  give_up_after: 900
# **Played into the stage's second chapter**, its midstage row at frame 1005 of the stage, and the chapter asked
# to be taken again there.
- play_until: { stage: 1, chapter: 2 }
  give_up_after: 18000
- start_over: true
- answer: { question: retry, item: 0 }
  give_up_after: 600
# And on into the chapter after it, the midboss's arrival at 2111.
- play_until: { stage: 1, chapter: 3 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
