# **A run of th11 in 完全無欠ボムモード on Lunatic, hit in its first chapter with the bomb button pressed once as
# the hit lands**, the other half of what the mode judges: a press in time, so the chapter is put back with
# every life the run had, and the one press sets no bomb off.
#
# **The walk is `a_bomb_mode_run_hit_without_the_press.yaml`'s**, with the hit taken with the press — on Lunatic,
# where a hit judged the other way would have cost a whole life.
- wait_until: { screen: 1 }
  give_up_after: 3600
- press: [up]
  frames: 10
  until: { screen: 1, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { question: mode }
  give_up_after: 900
- answer: { question: mode, item: 2 }
  give_up_after: 300
- answer: { question: difficulty, item: 3 }
  give_up_after: 300
- wait_until: { screen: 5 }
  give_up_after: 1800
- press: [up]
  frames: 10
  until: { screen: 5, cursor: 0 }
  give_up_after: 900
- press: [down]
  frames: 10
  until: { screen: 5, cursor: 1 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 6 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 6, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 7 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- bombs: false
- press: [decide]
  frames: 10
  until: { stage: 1, chapter: 0 }
  give_up_after: 900
- take_hits: { chance: 1.0, times_each_retry: 0.0, gives_up: 0.0, presses_the_bomb: true }
- play_until: { stage: 1, chapter: 2 }
  give_up_after: 36000
- take_hits: { chance: 0.0, times_each_retry: 0.0, gives_up: 0.0 }
- play_until: { frames: 600 }
- leave: true
- wait_until: { frames: 300 }
- quit: true
