# **A chapter of th11's second stage taken again and played past**, which is what says the mode's chapters
# are the stage's own and not the run's: a snapshot taken in stage 2 puts the run back into stage 2, with
# the stage's own clock and its generator where that chapter began.
#
# **And stage 2 is a stage begun out of a fade**: a stage entered from the one before begins under the game object's
# `0x800` (0x420424), where a stage built from the menu does not — which is what the pick-up of this run in the case
# after it has to put back (`resume::Numbers::began_out_of_a_fade`).
#
# **The front end is walked by this game's own screen numbers** — see `a_run_started_and_given_up.yaml`,
# which walks the same four — with orb's own mode question over the main menu's first item answered with the
# pointdevice mode: the chapters are the mode's.
- wait_until: { screen: 1 }
  give_up_after: 3600
- press: [up]
  frames: 10
  until: { screen: 1, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { question: mode }
  give_up_after: 900
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 5 }
  give_up_after: 1800
- press: [up]
  frames: 10
  until: { screen: 5, cursor: 0 }
  give_up_after: 900
- press: [down]
  frames: 10
  until: { screen: 5, cursor: 1 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 6 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 6, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 7 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- bombs: false
- press: [decide]
  frames: 10
  until: { stage: 1, chapter: 0 }
  give_up_after: 900
# **The run played into the second stage**: stage 1's last card began at frame 8223 of a run by the rules on a
# launch of the real game, 2026-10-07, and a death in it costs the chapter again.
- play_until: { stage: 2, chapter: 1 }
  give_up_after: 30000
# **And that chapter asked for again through the game's own pause menu item**, which costs no death: orb
# takes the item off and answers with its own question, whose first item is the chapter the run is in.
- start_over: true
- answer: { question: retry, item: 0 }
  give_up_after: 600
# **And played past it, which the midboss's arrival is**: a chapter is cut where a boss arrives — stage 2's at frame
# 2521 — so a run that reaches her from the chapter it was put back into has crossed the boundary the check looks
# for.
- play_until: { boss: true }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
