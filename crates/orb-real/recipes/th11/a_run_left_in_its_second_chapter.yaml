# **A run of th11 left for the title in the second chapter of its first stage**, which is what a resume is
# offered out of: the chapter a run stops in is kept as it goes, and giving the run up is the interruption
# somebody playing makes.
#
# **The second chapter of this game's first stage is its midstage row**, at frame 1005 of the stage: the stage is
# cut at its start, at the rows of its midstage table and where a fight's attacks are told apart.
#
# **The front end is walked by this game's own screen numbers** — see `a_run_started_and_given_up.yaml`,
# which walks the same four — with orb's own mode question over the main menu's first item, answered with the
# pointdevice mode: a chapter is only kept where the mode is settled.
- wait_until: { screen: 1 }
  give_up_after: 3600
- press: [up]
  frames: 10
  until: { screen: 1, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { question: mode }
  give_up_after: 900
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 5 }
  give_up_after: 1800
- press: [up]
  frames: 10
  until: { screen: 5, cursor: 0 }
  give_up_after: 900
- press: [down]
  frames: 10
  until: { screen: 5, cursor: 1 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 6 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 6, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 7 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- bombs: false
- press: [decide]
  frames: 10
  until: { stage: 1, chapter: 0 }
  give_up_after: 900
# **The run played into that chapter and no further**, which is where it is left.
- play_until: { stage: 1, chapter: 2 }
  give_up_after: 18000
# **And given up for the title**, which `quit` cannot be: closing the process leaves a run nobody left, where
# this is the interruption a resume is for.
- leave: true
- wait_until: { frames: 300 }
- quit: true
