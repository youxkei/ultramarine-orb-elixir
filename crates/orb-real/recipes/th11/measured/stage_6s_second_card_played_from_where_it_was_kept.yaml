# **Stage 6's second card, 爆符「メガフレア」 (card 147), played from a chapter a case kept**, for `cargo xtask real
# --again` with `--again-from` the kept chapter's directory — `hits/s6-c7-f…` of a Normal run of Reimu and Yukari — to
# count how often its way is hit there: the run is picked up where it was kept and played to the chapter after. Not a
# case: no check reads it.
#
# The walk is the_run_picked_up_where_it_was_left's: Normal, the first shot type, and the resume question answered.
- wait_until: { screen: 1 }
  give_up_after: 3600
- press: [up]
  frames: 10
  until: { screen: 1, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { question: mode }
  give_up_after: 900
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 5 }
  give_up_after: 1800
- press: [up]
  frames: 10
  until: { screen: 5, cursor: 0 }
  give_up_after: 900
- press: [down]
  frames: 10
  until: { screen: 5, cursor: 1 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 6 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 6, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 7 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- bombs: false
- press: [decide]
  frames: 10
  until: { question: resume }
  give_up_after: 900
- answer: { question: resume, item: 0 }
  give_up_after: 1800
- play_until: { stage: 6, chapter: 8 }
  give_up_after: 36000
- leave: true
- wait_until: { frames: 300 }
- quit: true
