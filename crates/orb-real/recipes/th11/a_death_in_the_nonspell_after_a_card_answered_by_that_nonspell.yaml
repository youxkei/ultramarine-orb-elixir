# A run of th11 hit on purpose in the first attack a boss moves to after a card, and the death answered by the
# rules with the chapter again — which has to put the run back at that attack's own start and not at the
# card's. th06nc's case of this name is where this was first missed, and says why the card and not a
# chapter's number is what the hit is aimed by. The walk is a_death_answered_by_the_chapter_again's.
- wait_until: { screen: 1 }
  give_up_after: 3600
- press: [up]
  frames: 10
  until: { screen: 1, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { question: mode }
  give_up_after: 900
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 5 }
  give_up_after: 1800
- press: [up]
  frames: 10
  until: { screen: 5, cursor: 0 }
  give_up_after: 900
- press: [down]
  frames: 10
  until: { screen: 5, cursor: 1 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 6 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 6, cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 10
  until: { screen: 7 }
  give_up_after: 900
- press: [up]
  frames: 10
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- bombs: false
- press: [decide]
  frames: 10
  until: { stage: 1, chapter: 0 }
  give_up_after: 900
# The first card of the run, the boss's: stage 1's midboss declares none, her chapters being her arrival and the
# stage after her. It came at frame 6463 of the stage on the launch of 2026-10-07.
- play_until: { card: true }
  give_up_after: 18000
# Hit in each chapter's first attempt and not in its retry: the card first, and then the nonspell after it, her
# second card having begun at 8223 on that launch.
- take_hits: { chance: 1.0, times_each_retry: 0.0, gives_up: 0.0 }
- play_until: { frames: 12000 }
  give_up_after: 24000
- leave: true
- wait_until: { frames: 300 }
- quit: true
