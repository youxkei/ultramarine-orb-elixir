# **The Extra, played out by the rules with the bomb allowed, after the run that cleared the game.**
#
# **The Extra is the main menu's second item**, which the game offers only once a run has been cleared — a
# fresh launch's cursor skipped it, going 0, 2, 3 … 9 — so this case follows `a_run_played_to_its_clear_without_a_bomb`
# in the same directory and the records that launch left. The screens after it are a Normal run's — 8 on its own,
# 9 with the difficulty already the Extra's, 11 the character, 13 the shot, and 14, 24 and 25 — and each takes a
# press, so what differs from the Normal run's walk is the item and that nothing is aimed at 9.
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 3 }
  give_up_after: 1800
- press: [down]
  frames: 6
  until: { screen: 3, cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 30 }
# **And orb's own question over that item, answered with the mode this case is of** — item 0, as th06c's
# own Extra answers it. Without this step the menu stands frozen behind a question nobody answers and
# screen 9 never comes: `a_run_played_to_its_clear_without_a_bomb` had the same hole and a launch of it
# read `mode: pointdevice to start with; the menu asks which` and then gave up every wait after it. orb
# has a question over both of the menu's first two items — see `Th06nc::menu_takes_a_press`.
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 9 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 11 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 11, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 13 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 13, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 14 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 24 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 25 }
  give_up_after: 1800
- wait_until: { frames: 30 }
# **The ways th06c's Extra was cleared with no hit by, under this game's numbers for the same cards**:
# 禁忌「レーヴァテイン」 is 122 here where it is 55 there, 禁弾「過去を刻む時計」 128 for 61 and
# 秘弾「そして誰もいなくなるか？」 129 for 62, each read off this game's traced Extra by the stage frame the card
# came up on — 14818 against th06c's 15184, 29177 against 29541, 30655 against 31551.
- dodge: { with: laevateinn, spell: 122 }
- dodge: { with: clock, spell: 128 }
- dodge: { with: and_then_there_were_none, spell: 129 }
- press: [decide]
  frames: 6
# **And the floor held after the midboss, the x the rules' own**, as th06c's Extra holds it — see that recipe for
# the holds it lost with. The stretch is chapters 7 and 8 here as there, this game's script running 100 behind
# th06c's — 4643 where th06c's resumes at 4743, and `game/th06nc/chapters.rs`'s Extra rows each 100 below
# th06c's — so the hold is bounded by the frames th06c's is: from 300 into chapter 7, for 2313 more, where
# chapter 9 begins.
- play_until: { stage: 7, chapter: 7 }
  give_up_after: 12000
- play_until: { frames: 300 }
- stand_at: { y: 432 }
- play_until: { frames: 2313 }
- stand_at: {}
# **The rest of the stage in one step**, the bomb the rules' to spend: it ends at the entry the game asks a name
# into, which the Extra reaches without an ending, cleared or lost.
- play_until: { name: true }
  give_up_after: 216000
# The name written into that entry rather than pressed for — see the Normal run's recipe.
- name: ORB
  give_up_after: 1800
# And pressed through the screen a run ends at to the title, so that the game writes its records of it —
# the title being where a run that finished comes back: see the Normal run's recipe, whose tail this is.
- press: [decide]
  frames: 6
  until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 300 }
- quit: true
