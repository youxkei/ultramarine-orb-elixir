# **A run of th06nc in 完全無欠ボムモード on Normal, hit with the bomb button never pressed, with a quarter of a life
# gone** — the last of the game's hearts shaved by that quarter — and the run held on the game's own pause for a
# picture taken from outside, orb taking none of a game drawn through a swapchain.
#
# **The walk is `a_bomb_mode_run_hit_with_the_press.yaml`'s**, which waits for the stage rather than for screen 25,
# on Normal and without the press.
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 3 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 3, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 2 }
  give_up_after: 300
- answer: { question: difficulty, item: 1 }
  give_up_after: 300
- bombs: false
- take_hits: { chance: 1.0, times_each_retry: 0.0, gives_up: 0.0 }
- wait_until: { screen: 9 }
  give_up_after: 1800
- press: [down]
  frames: 6
  until: { screen: 9, cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 11 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 11, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 13 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 13, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 14 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 24 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { stage: 1, chapter: 1 }
  give_up_after: 1800
- play_until: { frames: 1800 }
  give_up_after: 7200
- take_hits: { chance: 0.0, times_each_retry: 0.0, gives_up: 0.0 }
# The pause, held for the picture: the panel stays drawn under the pause menu.
- press: [menu]
  frames: 6
- wait_until: { frames: 2400 }
- press: [decide]
  frames: 6
- leave: true
- wait_until: { frames: 300 }
- quit: true
