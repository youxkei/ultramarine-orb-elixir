# A run of th06nc played into its stage, the retry question raised by the recipe rather than by a death,
# and answered with もう一度 — its first item — so that the chapter comes back with nothing lost.
#
# **The walk to the run is `a_death_answered_by_the_chapter_again`'s**, which is where the reading of this
# game's screens is written down: 2 the title, 3 the main menu, then 9, 11, 13, 14, 24 and 25.
#
# **Asked in the stage's second chapter and played on into its third**, th06c's recipe's chapters: the
# midboss's arrival is where the ask is made, and her card is what says the run went on after the chapter
# came back.
#
# **Item 0 is もう一度 whatever the run has behind it**, which is why this one needs no care about where the
# question is raised: `retry_ui` puts the chapter first of the ways on always, and leaves 更に前からやり直す
# out only where there is no chapter behind — see `the_stage_taken_again_from_its_start`, whose own item
# moves with that.
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 3 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 3, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 9 }
  give_up_after: 1800
- press: [down]
  frames: 6
  until: { screen: 9, cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 11 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 11, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 13 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 13, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 14 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 24 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 25 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
# **Nothing is taken on purpose**, which is what tells this retry from the one a death asks for: the run
# is asked to start over with every one of its lives in hand.
- play_until: { stage: 1, chapter: 2 }
  give_up_after: 18000
- start_over: true
- answer: { question: retry, item: 0 }
  give_up_after: 600
- play_until: { stage: 1, chapter: 3 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
