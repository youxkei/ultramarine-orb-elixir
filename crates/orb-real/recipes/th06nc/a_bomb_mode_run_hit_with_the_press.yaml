# **A run of th06nc in 完全無欠ボムモード on Lunatic, hit with the bomb button pressed once as the hit lands**, the
# other half of what the mode judges: a press in time, so the chapter is put back with every life the run had,
# and the one press sets no bomb off.
#
# **The walk is `a_bomb_mode_run_hit_without_the_press.yaml`'s**, with the hit taken with the press — on Lunatic,
# where a hit judged the other way would have cost a whole life.
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 3 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 3, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 2 }
  give_up_after: 300
- answer: { question: difficulty, item: 3 }
  give_up_after: 300
- bombs: false
# **The hit taken with the press told here and not where the walk ends**, as the case without the press tells
# it: the laid-out game builds the stage while the walk is still waiting at its own screens, and is hit at frame
# 313 before a step at the walk's end is reached — a hit nobody drew, which the rules press nothing for.
- take_hits: { chance: 1.0, times_each_retry: 0.0, gives_up: 0.0, presses_the_bomb: true }
- wait_until: { screen: 9 }
  give_up_after: 1800
- press: [down]
  frames: 6
  until: { screen: 9, cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 11 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 11, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 13 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 13, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 14 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 24 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
# **And the stage waited for rather than screen 25**, which reads no press and starts the run as soon as the run
# can be started (`0x14004dbe9`): a wait for it is a wait that misses it, and the stage then plays with the rules
# not steering until the wait gives up — a hit landing there is one nothing presses for.
- wait_until: { stage: 1, chapter: 1 }
  give_up_after: 1800
- play_until: { frames: 1800 }
  give_up_after: 7200
- take_hits: { chance: 0.0, times_each_retry: 0.0, gives_up: 0.0 }
- play_until: { stage: 1, chapter: 4 }
  give_up_after: 36000
- leave: true
- wait_until: { frames: 300 }
- quit: true
