# A run of 完全無欠モード played from the title to its clear on Normal with the bomb forbidden, for a clear with
# no hit and no bomb: a_run_played_to_its_clear's walk, with no chance of dying handed to the rules and the rules
# left to themselves through all six stages, as th06c's own case of this name leaves them.
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 3 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 3, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 9 }
  give_up_after: 1800
- press: [down]
  frames: 6
  until: { screen: 9, cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 11 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 11, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 13 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 13, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 14 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 24 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- bombs: false
- press: [decide]
  frames: 6
- wait_until: { screen: 25 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
# The whole run in one step, ending at the entry the game asks a name into — see a_run_played_to_its_clear.yaml.
- play_until: { name: true }
  give_up_after: 216000
- name: ORB
  give_up_after: 1800
- press: [decide]
  frames: 6
  until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 300 }
- quit: true
