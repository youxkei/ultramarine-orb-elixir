# A run of th06nc played into its stage's third chapter, the retry question raised by the recipe and
# answered with ステージの最初から, so that the stage is built again from its own start, and then played on
# into its second chapter again.
#
# **The walk to the run is `a_death_answered_by_the_chapter_again`'s**, which is where the reading of this
# game's screens is written down: 2 the title, 3 the main menu, then 9, 11, 13, 14, 24 and 25.
#
# **ステージの最初から is item 2**, as it is of th06c's recipe: asked in the midboss's card, the run has two
# chapters behind the one it is in, so 更に前からやり直す is among the ways on — see `retry_ui`, which leaves
# it out only where there is no chapter behind. Asked in the stage's first chapter, as this recipe was while
# `game/th06nc/chapters.rs` was empty, the stage is item 1: a launch that answered 3 there got
# `retry: item 3 is past the 3 way(s) on`.
#
# **And the item asks before it acts**, so the confirmation behind it is answered はい — item 0 of the
# question it raises of its own.
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 3 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 3, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 9 }
  give_up_after: 1800
- press: [down]
  frames: 6
  until: { screen: 9, cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 11 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 11, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 13 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 13, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 14 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 24 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 25 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- play_until: { stage: 1, chapter: 3 }
  give_up_after: 18000
- start_over: true
- answer: { question: retry, item: 2 }
  give_up_after: 600
- answer: { question: retry, item: 0 }
  give_up_after: 600
- play_until: { stage: 1, chapter: 2 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
