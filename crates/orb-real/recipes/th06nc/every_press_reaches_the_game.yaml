# **Every input orb holds, held in turn** — what `every_press_reaches_the_game` is a case about: a run started,
# and each of the pad's buttons pressed by the number a pad reports it under, with the game's own word read out
# of the trace on every frame. The walk into the run is `a_run_left_in_its_second_chapter.yaml`'s as far as the
# mode question, and the selects past it pressed through as that file presses them.
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 3 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 3, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- press: [decide]
  frames: 6
  until: { stage: 1, chapter: 1 }
  give_up_after: 3600
- play_until: { frames: 60 }
# **Each of the pad's buttons, by the number the pad reports it on** — the shot on 0, the bomb on 1, the focus on
# 5 (the right shoulder) and the pause on 7 (Start), the numbers `th06c`'s recipe presses: this game reads the
# same file with the same bindings, its `th06.cfg` keeping a button as XInput's bit index (12, 13, 9, 4) and the
# pad orb samples numbering buttons winmm and DirectInput's way.
- press_pad: [0]
  frames: 8
- press_pad: [1]
  frames: 8
- press_pad: [5]
  frames: 8
- press_pad: [7]
  frames: 8
# **And the four directions off the keyboard**, which orb holds the same way, for the game's d-pad bits.
- press: [up]
  frames: 8
- press: [down]
  frames: 8
- press: [left]
  frames: 8
- press: [right]
  frames: 8
- wait_until: { frames: 30 }
- quit: true
