# A run of th06nc hit on purpose in the first attack a boss moves to after its first card, and the death
# answered by the rules with the chapter again — which has to put the run back at that attack's own start
# and not at the card's.
#
# **The mode's basic promise over a fight**: a boss's attacks are each a chapter, the nonspell between two
# cards as much as the cards. What says a nonspell began is the boss's attack timer going back to nought,
# and while this game's was not read only a fight's first nonspell was a chapter — a death in the one after
# a card went back to the card's start, seen on a run of a_run_played_to_its_clear on 2026-09-27.
#
# **Aimed by the card and not by a chapter's number**: the first card up is waited for and the chance of
# being hit handed over while it runs. A chance handed over counts for the attempt already under way —
# `orb_bot::hits::Hits::told` — so the card is died in first and its retry, at a chance of nought, played
# clean; the next death is in the attack the fight moves to after the card, which is the one the check reads.
# The walk is a_death_answered_by_the_chapter_again's.
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 3 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 3, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 9 }
  give_up_after: 1800
- press: [down]
  frames: 6
  until: { screen: 9, cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 11 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 11, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 13 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 13, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 14 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 24 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
- wait_until: { screen: 25 }
  give_up_after: 1800
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
# **The first card of the run**, stage 1's boss's on the real game.
- play_until: { card: true }
  give_up_after: 18000
# **Hit in each chapter's first attempt and not in its retry**, which is what the chapter again has to carry
# the run through.
- take_hits: { chance: 1.0, times_each_retry: 0.0, gives_up: 0.0 }
# **A window of frames for both deaths and their retries**, the card's own frames twice among them: a boss's
# card on Normal runs a minute at the most.
- play_until: { frames: 9000 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
