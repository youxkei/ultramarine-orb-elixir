# The run a_death_answered_by_the_chapter_again left, offered as the run starts and answered with
# はじめから — which asks about the replay of the run being written over, kept here — and then a fresh run
# played on from the stage's own start.
#
# **The walk to the run is `a_death_answered_by_the_chapter_again`'s as far as the mode question**, which
# is where the reading of this game's screens is written down: 2 the title, 3 the main menu, then 9 the
# difficulty, 11 the character, 13 the shot, and 14, 24 and 25 each taking a press before the stage.
#
# **And the selects are pressed through in one step rather than one step apiece**: a select of this game
# goes by on its own after a while, so a step that waits for screen 11 can be a step the game has already
# walked past, and a step that gives up costs its whole bound — which is how a launch of the step-apiece
# shape had the decide it was still holding answer the resume question itself. See
# `the_run_picked_up_in_the_stage_it_walked_into`, where that happened.
#
# **What says the fresh run played on is the stage's own clock**, not a second chapter: this game has one
# chapter a stage until `game/th06nc/chapters.rs` is filled.
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 3 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 3, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- press: [decide]
  frames: 6
  until: { question: resume }
  give_up_after: 3600
- answer: { question: resume, item: 1 }
  give_up_after: 600
- answer: { question: keep_replay, item: 0 }
  give_up_after: 900
- play_until: { frames: 900 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
