# A run of th06nc played into the second chapter of its first stage and left there, for
# the_run_picked_up_where_it_was_left to pick up.
#
# **The walk to the run is `a_death_answered_by_the_chapter_again`'s as far as the mode question**, and
# past it the selects are pressed through in one step: a select of this game goes by on its own, so a step
# apiece races it.
#
# **A second chapter of stage 1 is the midboss's own boundary here**, which is the one thing this case is
# written around: stage 1's one row, `game/th06nc/chapters.rs`'s 4346, is after the midboss, so the stage
# is one chapter until the midboss arrives. A probe recipe that waited on `boss: true` read the bit at
# stage frame 1,925, so the second chapter is a chapter the run reaches by playing as far as the midboss.
# Which is why the wait is on the boss first: `play_until: { stage: 1, chapter: 2 }` on its own would sit
# through the whole of the stage before it.
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 3 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 3, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- press: [decide]
  frames: 6
  until: { stage: 1, chapter: 1 }
  give_up_after: 3600
- play_until: { boss: true }
  give_up_after: 18000
- play_until: { stage: 1, chapter: 2 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
