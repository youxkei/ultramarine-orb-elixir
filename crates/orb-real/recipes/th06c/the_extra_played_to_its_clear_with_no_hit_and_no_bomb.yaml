# The Extra played from the title to its clear in the rewindable mode with the bomb forbidden, for a clear with no
# hit and no bomb — its walk to the run the_extra_a_cleared_run_unlocked's, the item there only where the game's
# own records hold the Normal clear a_normal_mode_run_played_to_its_clear left in them.
#
# **Every stretch the rules could not take on their own is dodged the way `orb_bot`'s own table for th06c's Extra
# names** — `orb_bot::ways`: the floor held through chapters 7 and 8, and the three cards their dodges.
#
# **The last step is bounded by a chapter the stage never reaches**, so that it ends where the run does: a `play`
# step ends on the run being over, which the Extra's clear is.
- wait_until: { screen: 1 }
  give_up_after: 7200
- press: [decide]
  frames: 6
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [down]
  frames: 6
  until: { screen: 2, cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 30 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 7 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 7, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 9 }
  give_up_after: 1800
- wait_until: { frames: 120 }
- bombs: false
- press: [decide]
  frames: 6
  until: { stage: 7, chapter: 1 }
  give_up_after: 3600
- play_until: { stage: 7, chapter: 40 }
  give_up_after: 86000
- leave: true
- wait_until: { frames: 300 }
- quit: true
