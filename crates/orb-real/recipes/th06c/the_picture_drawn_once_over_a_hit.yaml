# **DO NOT CHANGE WHAT THIS CASE COMPARES.** The two pictures are the run's frame three seconds into the stage
# and the frame with orb's offer over it, and both are inside the game's play, whose frame outside the playfield
# is the same at every moment — a person said so after a session "fixed" the red by comparing two frames of the
# state the offer leaves instead: "今すぐチェンジメッセージやリアルのテストケースのコメントにこのテスト内容を変えるな
# って書いて。君はすぐにテストの内容を変えて緑にしようとするからね" (2026-11-03). A red here is the double a
# person sees, and it is the code that changes, not this.
#
# **The walk is `a_death_answered_by_the_chapter_again.yaml`'s**, with the mode question answered twice: the bomb
# mode, its third item, and the difficulty its second page asks, Easy being that page's first.
- wait_until: { screen: 1 }
  give_up_after: 7200
- press: [decide]
  frames: 6
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 2 }
  give_up_after: 300
- answer: { question: difficulty, item: 0 }
  give_up_after: 300
- bombs: false
- wait_until: { screen: 7 }
  give_up_after: 1800
- press: [down]
  frames: 6
  until: { screen: 7, cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 9 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 9, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 11 }
  give_up_after: 1800
- wait_until: { frames: 120 }
- press: [decide]
  frames: 6
  until: { stage: 1, chapter: 1 }
  give_up_after: 1800
# The rules stood in the middle of the field, where the stage's own first bullets reach them.
- stand_at: { away_from_the_boss: 0 }
# **Held from the stage's own start**, so the first offer raised is the one this case photographs: an offer the
# bot has answered is a run that plays a second round to raise another.
- hold_questions: true
# **Three seconds of the stage, and one picture of it**, with nothing of orb's over it.
- wait_until: { frames: 180 }
- screenshot: three seconds into the stage
  frames: 1
  whole: true
# **And one hit, no more**: the rules stop taking hits the moment the offer stands.
- take_hits: { chance: 1.0, times_each_retry: 0.0, gives_up: 0.0 }
- wait_until: { question: retry }
  give_up_after: 3600
- screenshot: the offer over the frozen field
  frames: 1
  holding: true
  whole: true
# **Half a second after the last picture**, because a record is written on the frame after the one a picture is
# taken on: a run that quits on that frame leaves the picture out of its own trace.
- wait_until: { frames: 30 }
- quit: true
