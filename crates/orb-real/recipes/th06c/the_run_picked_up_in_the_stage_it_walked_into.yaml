# The run a_chapter_of_the_stage_after_the_first left in its second stage, offered as a run starts and taken
# up there — a stage the run walked into rather than started at, which is the pick-up that puts a stage's
# numbers back in — and then played into the chapter after. The walk is the_run_picked_up_where_it_was_left's.
- wait_until: { screen: 1 }
  give_up_after: 7200
- press: [decide]
  frames: 6
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 7 }
  give_up_after: 1800
- press: [down]
  frames: 6
  until: { screen: 7, cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 9 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 9, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
- wait_until: { screen: 11 }
  give_up_after: 1800
- wait_until: { frames: 120 }
- press: [decide]
  frames: 6
  until: { question: resume }
  give_up_after: 1800
- answer: { question: resume, item: 0 }
  give_up_after: 600
- play_until: { stage: 2, chapter: 3 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
