# A run of the rewindable mode started from the title, played into its second chapter, and left for the title
# — which is what leaves a run for the_run_picked_up_where_it_was_left to pick up.
#
# **The front end is walked by this game's own screen numbers**, `Game::front_end_screen` answering the front
# end's state: 1 is the logo, 2 the title, 7 the difficulty, 9 the character select and 11 the shot select.
# `orb-core`'s `game/th06c/asm.md` has where each was read.
#
# **Six frames a press, because these menus repeat a held key** rather than taking one edge from it: a launch
# whose presses were thirty frames long moved two screens on one press. Thirty is what th06 1.02h and th07 want.
#
# **And each screen waited for and pressed at exactly once**, a press with an `until` pressing again on the frame
# its condition becomes true — so only the steps that aim at an item, or at one of orb's own questions, are the
# repeating kind, and each aims within a screen it is already on.
- wait_until: { screen: 1 }
  give_up_after: 7200
- press: [decide]
  frames: 6
- wait_until: { screen: 2 }
  give_up_after: 36000
- wait_until: { frames: 60 }
# The title's Start item, which the cursor comes up on, and orb's question over it: the press is held back
# until the mode is answered and then handed over, so the item starts the run.
- press: [decide]
  frames: 6
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
# Normal, aimed for by the cursor rather than counted to: which item the difficulty select comes up on is
# whatever the copy's own configuration remembered, and Hard, the item after Normal, is harmless where a tap
# overshoots by one.
- wait_until: { screen: 7 }
  give_up_after: 1800
- press: [down]
  frames: 6
  until: { screen: 7, cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
# Reimu, and her first shot: what it fires follows what it is fired at, so what the rules have to get right is
# the dodging and not the aim.
- wait_until: { screen: 9 }
  give_up_after: 1800
- press: [up]
  frames: 6
  until: { screen: 9, cursor: 0 }
  give_up_after: 900
- wait_until: { frames: 60 }
- press: [decide]
  frames: 6
# The shot select swallows a press in the moment it arrives, so this waits before pressing, and presses until
# the stage's first chapter is up — a press at a stage of this game being a shot, which costs nothing.
- wait_until: { screen: 11 }
  give_up_after: 1800
- wait_until: { frames: 120 }
- press: [decide]
  frames: 6
  until: { stage: 1, chapter: 1 }
  give_up_after: 1800
- play_until: { stage: 1, chapter: 2 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
