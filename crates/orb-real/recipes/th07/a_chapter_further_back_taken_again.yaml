# 更に前からやり直す: the run asked to start over in its third chapter, the question answered with the
# chapters behind that one, and the nearest of them chosen and confirmed — so the run comes back in a chapter
# it had already played through and plays it again.
#
# Three answers because the screen asks three times: the ways on, then the chapters behind, then はい. The
# item that lists them is no answer of its own — see `retry_ui::RetryMenu::answered_outright` — and each list
# is answered by naming a place in it, a press taking whichever item orb's own cursor came up on.
#
# The front end is walked as a_run_left_in_its_second_chapter.yaml walks it.
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
# Normal, aimed for by the cursor — see a_run_left_in_its_second_chapter.yaml.
- wait_until: { frames: 60 }
- press: [down]
  frames: 6
  until: { screen: 4, cursor: 1 }
  give_up_after: 600
- press: [decide]
  frames: 6
  until: { stage: 1, chapter: 1 }
  give_up_after: 1800
# The third chapter, so that the list has a chapter behind the one that was lost as well as the stage's own
# start: the nearest of them is then a chapter and not the stage.
- play_until: { stage: 1, chapter: 3 }
  give_up_after: 18000
- start_over: true
- answer: { question: retry, item: 1 }
  give_up_after: 600
- answer: { question: retry, item: 0 }
  give_up_after: 600
- answer: { question: retry, item: 0 }
  give_up_after: 600
- play_until: { stage: 1, chapter: 3 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
