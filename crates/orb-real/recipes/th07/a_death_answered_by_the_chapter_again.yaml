# A run whose first attempt at every chapter is hit on purpose and whose second is played clean, so that the
# retry question comes up and is answered by the rules with the chapter again — the whole content of the mode,
# which a run that dodges everything never reaches.
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
# Normal, aimed for by the cursor — see a_run_left_in_its_second_chapter.yaml.
- wait_until: { frames: 60 }
- press: [down]
  frames: 6
  until: { screen: 4, cursor: 1 }
  give_up_after: 600
- press: [decide]
  frames: 6
  until: { stage: 1, chapter: 1 }
  give_up_after: 1800
# **The chapter after the one it is hit in, which is where both games have had exactly one death.** A chance of
# one per chapter is a death in every chapter that has something to be hit by, so a run played to the third
# chapter raised this question twice on the real game and once on a laid-out one. Both are hit in the first
# chapter here — this game's laid-out stage aims a bullet at where the player is from its first frames, and the
# real game was still in its first chapter when it died 900 frames into the step — so the chapter after that
# one is a bound they share.
#
# **And the chance is not turned on inside a chapter instead**, which is what the th06 case's window is: the
# rules ignore the hazards for sixty frames before they walk at the nearest of them, and a laid-out chapter is
# shorter than that walk — hits turned on in the second chapter reached the third with nothing hit at all.
#
# **And the question itself cannot be waited for**: the rules answer the offer the frame it comes up, so a
# `play_until: { question: retry }` never sees one — written that way, the step ran to its whole bound while
# the run died in thirty-two chapters in a row.
- take_hits: { chance: 1.0, times_each_retry: 0.0, gives_up: 0.0 }
- play_until: { stage: 1, chapter: 2 }
  give_up_after: 36000
# And the run left where it stands, with nothing played by the rules after that bound: the chance is still one
# where the chapter the step ended at was drawn for, and a step that handed that chapter frames would be a
# second death.
- leave: true
- wait_until: { frames: 300 }
- quit: true
