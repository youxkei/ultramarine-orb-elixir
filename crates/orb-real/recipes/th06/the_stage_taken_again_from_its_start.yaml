# ステージをやり直す: the run asked to start over in its third chapter and sent back to the stage's own
# start, which is the oldest chapter there is — and the item asks before it acts, so はい is a second answer
# of its own.
#
# The item is the third of the ways on because the one that lists the chapters behind is offered here: it is
# left out only where nothing is behind the chapter that was lost, which is a stage's own first chapter.
#
# The front end is walked as a_run_left_in_its_second_chapter.yaml walks it.
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
# Normal, aimed for by the cursor — see a_run_left_in_its_second_chapter.yaml.
- wait_until: { frames: 60 }
- press: [down]
  frames: 6
  until: { screen: 7, cursor: 1 }
  give_up_after: 600
- press: [decide]
  frames: 6
  until: { stage: 1, chapter: 1 }
  give_up_after: 1800
- play_until: { stage: 1, chapter: 3 }
  give_up_after: 18000
- start_over: true
- answer: { question: retry, item: 2 }
  give_up_after: 600
- answer: { question: retry, item: 0 }
  give_up_after: 600
- play_until: { stage: 1, chapter: 2 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
