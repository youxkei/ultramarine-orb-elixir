# **Every input orb holds, held in turn** — what `every_press_reaches_the_game` is a case about: a run started,
# and each of the pad's buttons pressed by the number a pad reports it under, with the game's own word read out
# of the trace on every frame. The walk into the run is `a_run_left_in_its_second_chapter.yaml`'s, stopped where
# the run begins.
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { frames: 60 }
- press: [down]
  frames: 6
  until: { screen: 7, cursor: 1 }
  give_up_after: 600
- press: [decide]
  frames: 6
  until: { stage: 1, chapter: 1 }
  give_up_after: 1800
- play_until: { frames: 60 }
# **Each of the pad's buttons, by the number the pad reports it on** — the shot on 0, the bomb on 1, the focus on
# 2 and the menu on 4, measured on this game: a launch held buttons 0 to 7 in turn and the game's own word read
# `0x1`, `0x2`, `0x4`, `0x100` and `0x8` for the first five and nought for the rest. A name of orb's would say
# what orb meant to press; the number says what a person pressed, and the game — not orb — says what that button
# is. **The defaults and not the copy's file**, because the session takes `東方紅魔郷.cfg` aside and this is what
# the game binds when there is none.
- press_pad: [0]
  frames: 8
- press_pad: [1]
  frames: 8
- press_pad: [2]
  frames: 8
- press_pad: [4]
  frames: 8
# **And the four directions off the keyboard**, which orb holds the same way, for the game's d-pad bits.
- press: [up]
  frames: 8
- press: [down]
  frames: 8
- press: [left]
  frames: 8
- press: [right]
  frames: 8
- wait_until: { frames: 30 }
- quit: true
