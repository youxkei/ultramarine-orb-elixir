# **A run of th06 in 完全無欠ボムモード on Lunatic, hit in its first chapter with the bomb button never pressed**,
# which is what the mode adds over this game: the hit judged at the death it settles as, a whole life taken
# for it, and the chapter put back with the life still taken.
#
# **The walk is `a_death_answered_by_the_chapter_again.yaml`'s**, with the mode question answered twice: the
# bomb mode, its third item, and then the difficulty its second page asks, Lunatic being that page's fourth.
# And the rules kept off the bomb, which would take the hit back and leave nothing to judge.
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 2 }
  give_up_after: 300
- answer: { question: difficulty, item: 3 }
  give_up_after: 300
- bombs: false
- wait_until: { frames: 60 }
- press: [down]
  frames: 6
  until: { screen: 7, cursor: 1 }
  give_up_after: 600
- press: [decide]
  frames: 6
  until: { stage: 1, chapter: 1 }
  give_up_after: 1800
- take_hits: { chance: 1.0, times_each_retry: 0.0, gives_up: 0.0 }
# **Eighteen hundred frames and not the four hundred the death case gives**, th06c's own: a hit lands when the
# rules next come near a bullet, and a launch of this on the real game played its four hundred with nothing
# near — the stage is seeded off the clock, so it is a different four hundred every launch. Two chapters of
# it are two hits at the most, which on Lunatic is the run's two lives and not its game over.
- play_until: { frames: 1800 }
  give_up_after: 7200
- take_hits: { chance: 0.0, times_each_retry: 0.0, gives_up: 0.0 }
- play_until: { stage: 1, chapter: 4 }
  give_up_after: 36000
- leave: true
- wait_until: { frames: 300 }
- quit: true
