# **A run of th06 in 完全無欠ボムモード on Normal, hit with the bomb button never pressed, and its panel pictured
# with a quarter of a life gone** — the last of the game's stars shaved by that quarter, which is what a part of
# a life looks like.
#
# **The walk is `a_bomb_mode_run_hit_without_the_press.yaml`'s**, on Normal rather than Lunatic: a hit there is a
# whole life and leaves nothing shaved. Two hits are half a life, which leaves the star shaved too.
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 2 }
  give_up_after: 300
- answer: { question: difficulty, item: 1 }
  give_up_after: 300
- bombs: false
- wait_until: { frames: 60 }
- press: [down]
  frames: 6
  until: { screen: 7, cursor: 1 }
  give_up_after: 600
- press: [decide]
  frames: 6
  until: { stage: 1, chapter: 1 }
  give_up_after: 1800
- take_hits: { chance: 1.0, times_each_retry: 0.0, gives_up: 0.0 }
- play_until: { frames: 1800 }
  give_up_after: 7200
- take_hits: { chance: 0.0, times_each_retry: 0.0, gives_up: 0.0 }
- screenshot: a_part_of_a_life_gone
  frames: 60
- leave: true
- wait_until: { frames: 300 }
- quit: true
