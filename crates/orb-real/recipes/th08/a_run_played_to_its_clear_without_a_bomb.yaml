# **A Normal run of th08 played to its clear by the rules with the bomb forbidden, in 完全無欠モード**, a
# death answered by the chapter again — and its Last Spell taken, which is what a whole run of this game is
# held to beside the clear: a boss beaten by a run that picked up her stage's norm of time orbs answers with
# one, and the last stage's norm is nought.
#
# **The front end is walked by this game's own screen numbers** — 0 is the title, whose item 0 starts a
# run, 4 is the difficulty on Normal and 5 the team select, which takes two presses — with orb's own mode
# question over the title's first item answered with the pointdevice mode.
- wait_until: { screen: 0 }
  give_up_after: 1800
- press: [up]
  frames: 30
  until: { cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 4 }
  give_up_after: 1800
- press: [decide]
  frames: 30
  until: { screen: 5 }
  give_up_after: 900
- press: [decide]
  frames: 12
- wait_until: { frames: 120 }
- press: [decide]
  frames: 12
- wait_until: { frames: 300 }
- bombs: false
# **Seven cards with a way of their own**, each taken up while its card runs and put down when it ends — so
# nothing brackets them, and the chapter a card falls in is the stage's table's business and not this
# recipe's. What each way does and the measurements it holds are `orb_bot::steer`'s, or `orb_bot::cards`'
# for a way named for its card; what is here is which card wants which, and why that one.
#
# **Card 94, stage 4b's `光符「アースライトレイ」`** — the ninth of that boss's attacks, after her Master Spark
# and before her Last Spell — whose lasers are laid up the field from its floor with an aimed 3-way between
# them. The strategy wiki starts it at or near an edge (`端あるいは少し端から始めて`) with the 3-way dodged on
# the outside, and has `中で避けると、ものすごくシビアだが、慣れると安定する` beside it; the rules were placed at
# `40` and at `96` and died at each of them, and the middle is where they get through.
- dodge: { with: in_the_middle, spell: 94 }
# **Card 97, Marisa's `魔砲「ファイナルスパーク」`, stage 4B's Last Spell**, whose laser is aimed where the run is,
# held there while it warns, fires 240 wide and then turns after the run until it points at it: the strategy
# wiki's way is to lead it — stand where it aims so that what it turns across is open ground, and keep out
# from under its root. Read off the enemies every frame, the run stood `83.7` off its middle, clear of the
# `160` it was read at while it warned and inside the `240` it fired at, and was hit the frame it fired. See
# `orb_bot::steer::A_FOLLOWING_LASERS_HALF_ACROSS`, and `ahead_of_a_following_laser` beside it for the lead.
- dodge: { with: out_of_the_following_laser, spell: 97 }
# **Card 105, stage 5's own `狂符「幻視調律（ビジョナリチューニング）」`**, whose lattice below the band it is
# born in comes down on the run for a hundred frames and is hidden, and harmless, for the next hundred. The
# strategy wiki's way is down with it and up again while the illusion is on — `どんどん上を意識していこう`, the
# bottom being where a run is crushed — so the rules climb back up while it is hidden, which they never did
# waiting high in the middle: see `orb_bot::cards`.
- dodge: { with: visionary_tuning, spell: 105 }
# **Card 113, stage 5's own `散符「真実の月（インビジブルフルムーン）」`**, whose rings go out of the boss at the
# top of the middle, vanish and come back where they have got to — dodged focused through the whole card, the
# strategy wiki's way through it being small moves down with each ring (`全方位弾が来たらそれに合わせて下がりつつ`)
# and the rules at their whole step drifting to a wall under it. Waiting high in the middle was tried and lost
# the card at the bottom-left corner six attempts running, the key never held.
- dodge: { with: focused, spell: 113 }
# **Card 120, the last stage's own `天丸「壺中の天地」`**, whose bullets go out from the boss in rings that
# fill the field and pile against its right: the rules told nothing were walked along the floor to the
# right wall and died in that corner, so they wait left of the middle.
- dodge: { with: left_of_the_middle, spell: 120 }
# **Card 128, the last stage's own `蘇活「生命遊戯 －ライフゲーム－」`**, which lays its bullets across the
# field and then fires them, piled against its left: the strategy wiki has it dodged at the bottom
# (`最下段で避ける事になる`) and a bomb advised, and the rules told nothing died along the floor, so they wait
# right of the middle.
- dodge: { with: right_of_the_middle, spell: 128 }
# **Card 144, Eirin's Last Spell `禁薬「蓬莱の薬」`**, which lets point items fall down the column under her that its
# fire is thickest in: eighteen of the twenty-three whole runs that reached it were hit on it, sixteen at the
# floor between `x = 143` and `212`, where a Normal clear through its last stretch wanted a point item on 22% of
# the frames and two practices of it wanted one on 7% and were hit on neither. So the rules go for none there,
# and wait where their own boxes say.
- dodge: { with: without_the_items, spell: 144 }
# **The whole run in one step**, which a `play` ends the frame the run is over: the pointdevice clear this
# case is the recipe of played 189,170 frames.
- play_until: { frames: 400000 }
  give_up_after: 420000
# And the ending the run went into, for the frames the check reads it off.
- wait_until: { frames: 600 }
- quit: true
