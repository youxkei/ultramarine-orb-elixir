# **A Normal run of th08 played to its clear by the rules with the bomb forbidden, in 完全無欠モード**, a
# death answered by the chapter again — and its Last Spell taken, which is what a whole run of this game is
# held to beside the clear: a boss beaten by a run that picked up her stage's norm of time orbs answers with
# one, and the last stage's norm is nought.
#
# **The front end is walked by this game's own screen numbers** — 0 is the title, whose item 0 starts a
# run, 4 is the difficulty on Normal and 5 the team select, which takes two presses — with orb's own mode
# question over the title's first item answered with the pointdevice mode.
- wait_until: { screen: 0 }
  give_up_after: 1800
- press: [up]
  frames: 30
  until: { cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 4 }
  give_up_after: 1800
- press: [decide]
  frames: 30
  until: { screen: 5 }
  give_up_after: 900
- press: [decide]
  frames: 12
- wait_until: { frames: 120 }
- press: [decide]
  frames: 12
- wait_until: { frames: 300 }
- bombs: false
# The cards the rules lost a run on are dodged the ways `orb_bot`'s own table for th08's Normal names —
# `orb_bot::ways`, which says which card wants which and why that one.
# **The whole run in one step**, which a `play` ends the frame the run is over: the pointdevice clear this
# case is the recipe of played 189,170 frames.
- play_until: { frames: 400000 }
  give_up_after: 420000
# **And the screen the run ends at**, which is what a clear of the rewinding games is held to as well: the
# name the ranking is registered under typed into its entry, and the replay of a run nobody will add to again
# kept — orb taking the game's own offer of one off that screen and putting up its own question in its place.
- name: ORB
  give_up_after: 9000
- press: [decide]
  frames: 6
  until: { question: keep_replay }
  give_up_after: 7200
- answer: { question: keep_replay, item: 0 }
  give_up_after: 600
- wait_until: { frames: 300 }
- quit: true
