# **Every input orb holds, held in turn** — what `every_press_reaches_the_game` is a case about: a run started,
# and each of the pad's buttons pressed by the number a pad reports it under, with the game's own word read out
# of the trace on every frame. The walk into the run is `a_run_left_in_its_second_chapter.yaml`'s, stopped where
# the run begins.
- wait_until: { screen: 0 }
  give_up_after: 1800
- press: [up]
  frames: 30
  until: { cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 4 }
  give_up_after: 1800
- press: [decide]
  frames: 30
  until: { screen: 5 }
  give_up_after: 900
- press: [decide]
  frames: 12
- wait_until: { frames: 120 }
- press: [decide]
  frames: 12
- play_until: { frames: 60 }
# **Each of the pad's buttons, by the number the pad reports it on** — the shot on 0, the bomb on 1, the focus on
# 2 and the menu on 4, which is this game's own default mapping, `0, 1, 2, 4, -1, -1, -1, -1, 3` — the eighteen
# bytes th07's module records for its own build, and what a launch of this game held each button in turn to see:
# 0 gave `0x1`, 1 `0x2`, 2 `0x4`, 3 `0x100` and 4 `0x8`. A name of orb's would say what orb meant to press; the
# number says what a person pressed, and the game — not orb — says what that button is.
- press_pad: [0]
  frames: 8
- press_pad: [1]
  frames: 8
- press_pad: [2]
  frames: 8
- press_pad: [4]
  frames: 8
# **And the four directions off the keyboard**, which orb holds the same way, for the game's d-pad bits.
- press: [up]
  frames: 8
- press: [down]
  frames: 8
- press: [left]
  frames: 8
- press: [right]
  frames: 8
- wait_until: { frames: 30 }
- quit: true
