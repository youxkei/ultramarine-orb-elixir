# **DO NOT CHANGE WHAT THIS CASE COMPARES.** The two pictures are the run's frame three seconds into the stage
# and the frame with orb's offer over it, and both are inside the game's play, whose frame outside the playfield
# is the same at every moment. A red here is the double a person sees, and it is the code that changes, not this.
#
# The walk is `a_bomb_mode_run_hit_without_the_press.yaml`'s: 完全無欠ボムモード, Easy, and the rules kept off the
# bomb, which would take the hit back and leave nothing to judge.
- wait_until: { screen: 0 }
  give_up_after: 1800
- press: [up]
  frames: 30
  until: { cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 2 }
  give_up_after: 300
- answer: { question: difficulty, item: 0 }
  give_up_after: 300
- bombs: false
- wait_until: { screen: 4 }
  give_up_after: 1800
- press: [decide]
  frames: 30
  until: { screen: 5 }
  give_up_after: 900
- press: [decide]
  frames: 12
- wait_until: { frames: 120 }
- press: [decide]
  frames: 12
- wait_until: { stage: 1, chapter: 1 }
  give_up_after: 3600
- stand_at: { away_from_the_boss: 0 }
- hold_questions: true
- wait_until: { frames: 180 }
- screenshot: three seconds into the stage
  frames: 1
  whole: true
- take_hits: { chance: 1.0, times_each_retry: 0.0, gives_up: 0.0 }
- wait_until: { question: retry }
  give_up_after: 3600
- screenshot: the offer over the frozen field
  frames: 1
  holding: true
  whole: true
- wait_until: { frames: 30 }
- quit: true
