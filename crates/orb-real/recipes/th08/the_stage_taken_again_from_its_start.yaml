# **th08's stage taken again from its own start**, which is the third of the ways orb's own question of
# where to start again offers: the snapshot the stage's first chapter is, rather than the chapter the run
# is standing in.
#
# **Asked in the stage's first chapter, where nothing is behind it.** `RetryMenu::new` leaves
# 更に前からやり直す out of the ways where the chapters behind the lost one are none, so the items here are
# the chapter, the stage and the run given up — and the stage is **item 1**. A recipe that asked deeper
# would have four items and the stage would be 2.
#
# **The front end is walked by this game's own screen numbers** — 0 is the title, whose item 0 starts a
# run, 4 is the difficulty on Normal and 5 the team select, which takes two presses — with orb's own mode
# question over the title's first item, answered with the pointdevice mode: the chapters are the mode's.
- wait_until: { screen: 0 }
  give_up_after: 1800
- press: [up]
  frames: 30
  until: { cursor: 0 }
  give_up_after: 900
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 4 }
  give_up_after: 1800
- press: [decide]
  frames: 30
  until: { screen: 5 }
  give_up_after: 900
- press: [decide]
  frames: 12
- wait_until: { frames: 120 }
- press: [decide]
  frames: 12
- wait_until: { frames: 300 }
# A second of the stage, so that the run is in its first chapter and no further.
- play_until: { frames: 60 }
  give_up_after: 7200
# **The ask, the stage named, and the screen that naming raises answered with yes.**
- start_over: true
- answer: { question: retry, item: 1 }
  give_up_after: 600
- answer: { question: retry, item: 0 }
  give_up_after: 600
# **And the run playing on from the stage's own start into its second chapter**, which is what says the
# snapshot landed and what the check holds it to — waited for by the chapter and not by a count of frames,
# which is a number that stops being enough whenever the table's first row of stage 1 moves.
- play_until: { stage: 1, chapter: 2 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
