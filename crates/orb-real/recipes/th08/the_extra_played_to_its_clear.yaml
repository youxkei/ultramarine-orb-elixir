# **The Extra, played out by the rules with the bomb allowed in 完全無欠モード, after the two runs that lit it** —
# a death answered by the chapter again, so that what the rules have to get through is each attack once and
# not the stage on its lives.
#
# **Item 1 of the title, the Extra, which the title steps over on records with no Kaguya clear in them**
# (0x46799c) — a copy that had cleared nothing read the cursor going 0, 3, 4 … 8 — and the records that
# light it are Eirin's and Kaguya's clears (`orb_real::Start::TheExtraOffered`).
#
# **Its walk is screens 0xc and 0xd**, the difficulty select's handler and then the team select's on the
# Extra's own numbers: the first settles `cursor + 4` (0x46a48d) and the second makes the stage the Extra's
# out of that (0x46ac08), its press read once it has come up — the same shape as a Normal run's 4 and 5.
- wait_until: { screen: 0 }
  give_up_after: 1800
- press: [down]
  frames: 30
  until: { cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 60 }
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 12 }
  give_up_after: 1800
- press: [decide]
  frames: 30
  until: { screen: 13 }
  give_up_after: 900
- press: [decide]
  frames: 12
- wait_until: { frames: 120 }
- press: [decide]
  frames: 12
- wait_until: { frames: 300 }
# Mokou's cards the rules lost an Extra on are dodged the ways `orb_bot`'s own table for th08's Extra names —
# `orb_bot::ways`.
# **The whole Extra in one step**, with every attempt at a chapter after the first waiting somewhere of its
# own — see `orb_bot::steer::aside_on`, which is what the eight attempts at Mokou's `滅罪「正直者の死」`
# that died at the same three places wanted.
- play_until: { frames: 400000 }
  give_up_after: 420000
- press: [decide]
  frames: 6
  until: { screen: 0 }
  give_up_after: 120000
- wait_until: { frames: 300 }
- quit: true
