# **A chapter of th08's Extra taken again**, which is what the rewinding games' Extra case holds and
# the_extra_played_to_its_clear, the whole run of it, does not: continuing that case, in the directory whose
# records hold the unlock the two Normal clears before it left.
#
# **The walk is the_extra_played_to_its_clear's**: the title's second item, orb's own mode question over it,
# and then the Extra's own two screens — 12 and 13, the team select taking two presses.
#
# **And the ask is the pause menu's own item and not a hit**, as a_chapter_taken_again_without_a_death's is:
# `start_over` presses it, orb takes the game's ask off and answers with its own question, and item 0 is the
# chapter again. Asked in the Extra's third chapter — the midstage table's second row, script 2393 — so the
# question stands over a chapter with two behind it, and played on into the fourth to say the run went on.
- wait_until: { screen: 0 }
  give_up_after: 1800
- press: [down]
  frames: 30
  until: { cursor: 1 }
  give_up_after: 900
- wait_until: { frames: 60 }
- press: [decide]
  frames: 30
  until: { question: mode }
  give_up_after: 1800
- answer: { question: mode, item: 0 }
  give_up_after: 300
- wait_until: { screen: 12 }
  give_up_after: 1800
- press: [decide]
  frames: 30
  until: { screen: 13 }
  give_up_after: 900
- press: [decide]
  frames: 12
- wait_until: { frames: 120 }
- press: [decide]
  frames: 12
- wait_until: { frames: 300 }
- play_until: { stage: 9, chapter: 3 }
  give_up_after: 18000
- start_over: true
- answer: { question: retry, item: 0 }
  give_up_after: 600
- play_until: { stage: 9, chapter: 4 }
  give_up_after: 18000
- leave: true
- wait_until: { frames: 300 }
- quit: true
