[package]
name = "orb-real"
version.workspace = true
edition.workspace = true
publish.workspace = true

# **The cases the real game is tested with, and the check each one's trace has to pass.** An e2e test drives
# orb through a game laid out by hand, and what it cannot say is that the layout is the game's — a constant
# wrong on both sides passes. What can say so is the real game played to the same point, which
# `--autoplay` does without anybody at the keyboard and `--trace` writes down frame by frame. Each case here
# is a recipe for one such launch and a check over the trace it leaves, and `cargo xtask real` is what runs
# them against a copy of the install.
#
# **A library as well as a binary**, because the same cases are played against the laid-out games in
# `orb-e2e`: a recipe that cannot reach its point on the fake, or a check that fails there, is found in the
# suite rather than after six minutes of the real game.
[dependencies]
# For `trace::Record` and `game::State`, which are what a check reads. No feature: nothing here lays a game
# out, it only reads what a launch wrote.
orb-core = { workspace = true }

# For the one test here, which is that every recipe this crate carries is one orb can read — see
# `every_recipe_reads`. A dependency of the test alone: what parses a recipe at a launch is orb's own copy,
# and a case is a `&'static str` until then.
[dev-dependencies]
orb-config = { workspace = true }
