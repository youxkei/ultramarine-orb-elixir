[package]
name = "orb-bot"
version.workspace = true
edition.workspace = true
publish.workspace = true

# **The harness that plays the game, which is not part of what orb does for anybody playing it.** A run to be
# picked up out of a file has to exist, and every measurement of a resume so far has cost somebody an
# afternoon of playing one. What is here is a recipe walked a step at a time and the word each frame is
# answered with — and it is a crate of its own so that none of it is in the logic that ships: `orb-core`
# holds a slot, `orb` fills it where `--autoplay` names a recipe, and a launch nobody asked to play itself
# never reaches any of this.
#
# The same shape as every other seam in this tree — `window::install_over`, `score::install_over`,
# `joystick::install_over` — where orb-core keeps the slot and something else decides what goes in it. See
# [docs/adr/0010](../../docs/adr/0010-orb-is-the-patched-bytes-and-everything-else-has-one-of-two-other-homes.md).

[dependencies]
orb-config = { workspace = true }
orb-core = { workspace = true }
