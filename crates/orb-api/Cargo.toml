[package]
name = "orb-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# The install point, and the branch in front of every seam function that reads it.
#
# Off in the DLL the game loads, so that a build with no simulated Windows in it does not
# pay for one: `mem::read` is called thousands of times a frame, and what it compiles to
# there is the volatile read and nothing else.
#
# On for anything that installs a simulated Windows, which is `orb-e2e`'s e2e tests and the
# crates they pull in. A feature rather than `cfg(test)` because `cfg(test)` is false in a
# crate compiled as a *dependency* of a test binary — which is what `orb-core` is when
# `orb-e2e` drives it, and the whole reason those e2e tests can exist.
sim = []

# Only the real implementation is target-gated. The trait and the neutral types build on any
# host, which is what lets `orb-core` and `orb-sim` be tested on a Linux runner.
[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    # `MultiByteToWideChar`, for the device name winmm gives in the machine's own code page.
    "Win32_Globalization",
    # The compositor and the monitor, which the pacing reads its cadence from.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # `GetKeyboardState`, which orb's own menus read because the game's input handling is not
    # running on the frames they are up on.
    "Win32_UI_Input_KeyboardAndMouse",
    # `joyGetPosEx` and `joyGetDevCapsA`, which are the branch the game reads a pad through where its
    # own enumeration found no game controller.
    "Win32_Media_Multimedia",
    "Win32_UI_WindowsAndMessaging",
    # `CreateFileW` takes a `SECURITY_ATTRIBUTES` and `WriteFile` an `OVERLAPPED`, which are
    # declared in these two rather than beside the calls that name them.
    "Win32_Security",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    # `PROCESS_HEAP_REGION`, which the heap walk tests each entry against and which is declared here
    # rather than beside `HeapWalk`.
    "Win32_System_SystemServices",
    "Win32_System_Performance",
    "Win32_System_Threading",
]
