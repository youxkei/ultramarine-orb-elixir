[package]
name = "orb"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "orb"
# `rlib` beside the DLL the game loads, so that `orb-e2e`'s scenarios can drive this crate from outside
# it. **Which they still do, after everything a scenario drives moved to `orb-core`** — see
# [docs/adr/0009](../../docs/adr/0009-orb-injects-and-nothing-else-and-every-com-object-is-behind-the-seam.md),
# whose plan expected this line to go and whose status records that it does not. What is left here that a
# game laid out by hand needs is the rewrite of each import a real launch patches: it has no import table,
# so where a launch patches the entry it *calls* `window::create_window_ex_a`, `score::create_file_a` and
# `joystick::answer` itself, and `attach_to` is how it is attached to with no process to patch.
#
# Another crate rather than this one's own `#[cfg(test)]`, and that is the point: `cfg(test)` is false
# in a crate compiled as a dependency, so a scenario reaches the simulated Windows the same way the
# shipped DLL would reach the real one — through the `sim` feature and nothing else. It is also what
# one of them found: a `cfg(test)` branch in `memtrack` that a scenario does not take.
crate-type = ["cdylib", "rlib"]

[dependencies]
orb-api.workspace = true
orb-config.workspace = true
orb-core.workspace = true
serde = { version = "1", features = ["derive"] }

# MessagePack through serde: the file a run is left in is the same derived structs as everything
# else, written with the field names in them so that any converter can print one back without being
# told the format. See `resume::EXTENSION`.
rmp-serde = "1.3"

# For `build.rs`, which bakes `brush.png` down to the coverage the mark over the lives is drawn
# from. Only the inflate is taken from a crate: walking a PNG's chunks and undoing its row filters
# is sixty lines that say what the picture is, where a decoder would be eight crates saying it for
# every picture there has ever been.
[build-dependencies]
miniz_oxide = "0.8"

# For the tests over the file a run is left in, which build a MessagePack map by hand: what has to be
# refused is a *file* of the wrong shape, however it came to be one, and that is not something the
# derived writer can be asked to produce.
#
# `orb-sim` is here rather than in `[dependencies]` so that the `sim` feature it turns on reaches
# only the test build. In the DLL the game loads the install point does not exist, and `mem::read`
# — called thousands of times a frame — compiles to the volatile read and nothing else.
[dev-dependencies]
# `sim` here rather than above for the same reason `orb-sim` is: it is what makes
# `game::th06::image` — the game laid out by hand — reachable, and only a test wants it.
orb-core = { workspace = true, features = ["sim"] }
orb-sim.workspace = true
rmpv = "1.3"

[dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Media",
    "Win32_Media_Multimedia",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
