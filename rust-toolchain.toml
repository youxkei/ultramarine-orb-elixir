# Nightly for one feature: artifact dependencies (`-Z bindeps`), which is how the
# launcher gets orb.dll to carry inside itself. Cargo builds the cdylib first and hands
# over its path, so the two halves cannot fall out of step and there is one file to
# install rather than two.
# Three targets: what ships, the 64-bit build of it that th06c's own tests are the suite of, and the
# host with no Windows on it that `cargo xtask seam` checks the crates above the seam against. All
# here so that a fresh checkout can run the checks without being told to add one — see
# `crates/xtask/src/main.rs` for what each is for, `TARGET`, `ALSO` and `SEAM_TARGET` in that order.
[toolchain]
channel = "nightly"
# What `cargo llvm-cov` reads the profiles with — `llvm-profdata` and `llvm-cov` — for `cargo xtask coverage`.
components = ["llvm-tools"]
targets = [
    "i686-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "i686-unknown-linux-gnu",
]
