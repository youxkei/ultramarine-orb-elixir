# Read by both orb-launcher.exe and orb.dll, from their own directory. Every value below is
# the default, so this whole file is optional: without it orb runs exactly as it does with it
# as it stands, and installing orb is the one exe.
#
# A switch is written true or false, and a key nobody here reads is refused by name.
#
# What is here is what somebody playing sets and leaves set. Where the game is, building the
# midstage chapter table and looking into a fault are arguments to orb-launcher instead —
# `orb-launcher --help` — because those are one machine's or one launch's and not settings.

# Borderless, filling the monitor with the game's aspect ratio kept and the rest
# of the screen black. The game's own fullscreen setting is overruled, so what
# custom.exe says about it does not matter. Leave vpatch's [Window] section
# disabled, or the two will fight over where the window goes.
borderless: true

# Never show the ending. It is run out inside the frame it starts on rather than
# jumped over, so everything it does on the way — the clear flag, the score entry —
# still happens. The staff roll after it is kept and plays as it always did. Set to
# false to watch the ending too.
skip_ending: true

# Keep drawing while the window is not the one in use. The game stops reading the
# keyboard then, because it reads it globally rather than per window and would
# otherwise act on whatever is being typed somewhere else.
always_draw: true

# Refuse to write replay files. A run that has been rewound is not a run anyone
# could have played, so recording it would produce a replay that desynchronises.
block_replay_save: true

# Keep scores in orb_score.dat beside the game and leave its own score.dat
# alone, since a run that has been rewound is not a run anyone played. It starts
# as a copy of score.dat, so nothing it has unlocked is locked again, and the
# game's ranking screen then shows chapter-mode runs. false ranks them in the
# game's own file.
own_score_file: true

# Wash the play field green the moment a chapter begins, which is where dying now
# sends you back to. Dim and gone inside a sixth of a second; false for a screen
# with nothing of orb's on it at all. A --judge pass flashes either way, brighter
# and longer, since there the wash is what the pass is run with.
boundary_flash: true
